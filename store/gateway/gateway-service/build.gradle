bootBuildImage {
  builder = "paketobuildpacks/builder:tiny"
  imageName = "${System.getenv("REGISTRY")}/store/gateway"
  tags = ["${System.getenv("REGISTRY")}/store/gateway:${project.version}", "${System.getenv("REGISTRY")}/store/gateway:latest"]
  docker {
    publishRegistry {
      url = System.getenv("REGISTRY")
      username = "AWS"
      password = System.getenv("ECR_TOKEN")
    }
  }
}

ext {
  set('springCloudVersion', "2023.0.0")
}
dependencies {
  implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
  implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

  implementation project(':core:domain-certificate-manager:domain-certificate-manager-commons')
  implementation project(':commons:ecs-commons:fargate-task-info')
  implementation project(':commons:ecs-commons:ecs-service-discoveryclient')
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'io.projectreactor:reactor-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.testcontainers:junit-jupiter'
  testImplementation 'org.testcontainers:mockserver:1.19.6'
  testImplementation 'org.mock-server:mockserver-client-java:5.15.0'
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
  }
}
