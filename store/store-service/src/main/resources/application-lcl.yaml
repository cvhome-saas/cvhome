spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/storedb
    username: postgres
    password: password
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/realms/cvhome/protocol/openid-connect/certs
  cloud:
    discovery:
      client:
        simple:
          instances:
            domain-ownership:
              - uri: "http://localhost:8081"
                metadata:
                  service-name: domain-ownership
                  instance: domain-ownership-1
            domain-certificate-manager:
              - uri: "http://localhost:8082"
                metadata:
                  service-name: domain-certificate-manager
                  instance: domain-certificate-manager-1
            store:
              - uri: "http://localhost:8083"
                metadata:
                  service-name: store
                  instance: store-1
            auth:
              - uri: "http://localhost:9999"
                metadata:
                  service-name: auth
                  instance: auth-1
            ui:
              - uri: "http://localhost:4200"
                metadata:
                  service-name: ui
                  instance: ui-1
            gateway:
              - uri: "http://localhost:8080"
                metadata:
                  service-name: gateway
                  instance: gateway-1
