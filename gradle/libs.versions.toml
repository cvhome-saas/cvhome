[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }
graalvm = { id = "org.graalvm.buildtools.native", version.ref = "graalvm" }
groovy-gradle-plugin = { id = "groovy-gradle-plugin" }
java-library-conventions = { id = "com.asrevo.java-library-conventions" }
java-application-conventions = { id = "com.asrevo.java-application-conventions" }
