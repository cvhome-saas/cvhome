reactor-test = { module = "io.projectreactor:reactor-test" }

mongodb-bson = { module = "org.mongodb:bson", version.ref = "mongodbBson" }
dnsjava = { module = "dnsjava:dnsjava", version.ref = "dnsjava" }
aws-sdk-servicediscovery = { module = "software.amazon.awssdk:servicediscovery", version.ref = "awsSdkServicediscovery" }
