version: '3'
services:
  postgres:
    image: postgres:15-alpine
    network_mode: host
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cvhome
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    network_mode: host
    environment:
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_PORT: 8001
      KC_HTTP_MANAGEMENT_PORT: 9998

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:5432/cvhome
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password

      KEYCLOAK_ADMIN: sys-admin@mail.com
      KEYCLOAK_ADMIN_PASSWORD: admin

      COMMUNICATION_SERVICE_ENDPOINT: http://localhost:8000/communication

    command: --verbose start  --hostname-strict=false --import-realm --health-enabled=true
    #    command:  --verbose start --log-level=TRACE --hostname-strict=false --hostname-path=/auth --import-realm  --debug
    #    command:  --verbose start  --hostname-strict=false --import-realm
    volumes:
      - ./store-core/core-auth/keycloak/imports:/opt/keycloak/data/import
      - ./store-core/core-auth/keycloak/providers:/opt/keycloak/providers
      - ./store-core/core-auth/keycloak/themes/json-mail-theme:/opt/keycloak/themes/json-mail-theme
      - ./store-core/core-auth/keycloak/themes/cvhome:/opt/keycloak/themes/cvhome

    ports:
      - "8001:8001"
      - "8787:8787"
      - "9000:9000"
      - "9998:9998"
    depends_on:
      - postgres
  store-pod-saas-gateway:
    image: ashraf1abdelrasool/saas-gateway:sha-8eed986
    network_mode: "host"
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - ./store-pod/store-pod-saas-gateway/Caddyfile:/etc/caddy/Caddyfile
    environment:
      NAMESPACE: gateway.com
      ASK_TLS_URL: http://store-pod-saas-gateway-1.gateway.com:80/merchant/api/v1/router/public/ask-for-tls
      DOMAIN_LOOKUP_URL: http://store-pod-saas-gateway-1.gateway.com:80/merchant/api/v1/router/public/lookup-by-domain
      CERT_BUCKET: random-bucket
      CERT_BUCKET_REGION: eu-central-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: store-pod-saas-gateway
  otel-collector:
    network_mode: host
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/logging-otel-collector-config.yml"]
    volumes:
      - ./extra/monitoring/logging-otel-collector-config.yml:/etc/logging-otel-collector-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"
