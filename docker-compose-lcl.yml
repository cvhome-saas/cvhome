version: '3'
services:
#  rabbitmq:
#    image: rabbitmq:4.0.2-management
#    ports:
#      - 5672:5672
#      - 15672:15672
  postgres:
    image: postgres:15-alpine
    network_mode: host
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cvhome
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
  minio:
    image: bitnami/minio:2025.4.22
    network_mode: host
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      MINIO_DEFAULT_BUCKETS: "d0dd4299-963a-4458-b31f-8efe31c35e8e"
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
  mailcatcher:
    image: dockage/mailcatcher:0.9
    network_mode: host
    ports:
      - "1080:1080"
      - "1025:1025"
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    network_mode: host
    environment:
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_PORT: 8001
      KC_HTTP_MANAGEMENT_PORT: 9998

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:5432/cvhome
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password

      KEYCLOAK_ADMIN: sys-admin@mail.com
      KEYCLOAK_ADMIN_PASSWORD: admin

      COMMUNICATION_SERVICE_ENDPOINT: http://localhost:8000/communication

    command: --verbose start  --hostname-strict=false --import-realm --health-enabled=true
    #    command:  --verbose start --log-level=TRACE --hostname-strict=false --hostname-path=/auth --import-realm  --debug
    #    command:  --verbose start  --hostname-strict=false --import-realm
    volumes:
      - ./store-core/core-auth/keycloak/imports:/opt/keycloak/data/import
      - ./store-core/core-auth/keycloak/providers:/opt/keycloak/providers
      - ./store-core/core-auth/keycloak/themes/json-mail-theme:/opt/keycloak/themes/json-mail-theme
      - ./store-core/core-auth/keycloak/themes/cvhome:/opt/keycloak/themes/cvhome

    ports:
      - "8001:8001"
      - "8787:8787"
      - "9000:9000"
      - "9998:9998"
    depends_on:
      - postgres
      - mailcatcher
  store-pod-saas-gateway:
    image: ashraf1abdelrasool/saas-gateway:sha-7ed71e3
    network_mode: "host"
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    environment:
      STORE_POD_GATEWAY: http://store-pod-1.gateway.com:8100
      ASK_TLS_URL: http://gateway.com:8000/manager/api/v1/router/public/ask-for-tls
      DOMAIN_LOOKUP_URL: http://gateway.com:8000/manager/api/v1/router/public/lookup-by-domain
      CERT_BUCKET: random-bucket
      CERT_BUCKET_REGION: eu-central-1
    volumes:
      - ./store-pod/gateway/store-pod-saas-gateway-service/Caddyfile:/etc/caddy/Caddyfile
