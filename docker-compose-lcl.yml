version: '3'
services:
  postgres:
    image: postgres:15-alpine
    network_mode: host
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cvhome
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
  store-pod-saas-gateway:
    image: ashraf1abdelrasool/saas-gateway:sha-4a6d381
    network_mode: "host"
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - ./store-pod/store-pod-saas-gateway/Caddyfile:/etc/caddy/Caddyfile
    environment:
      NAMESPACE: gateway.com
      ASK_TLS_URL: http://store-pod-saas-gateway-1.gateway.com:80/merchant/api/v1/router/public/ask-for-tls
      DOMAIN_LOOKUP_URL: http://store-pod-saas-gateway-1.gateway.com:80/merchant/api/v1/router/public/lookup-by-domain
      CERT_BUCKET: random-bucket
      CERT_BUCKET_REGION: eu-central-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: store-pod-saas-gateway
  otel-collector:
    network_mode: host
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/logging-otel-collector-config.yml"]
    volumes:
      - ./extra/monitoring/logging-otel-collector-config.yml:/etc/logging-otel-collector-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"
