spring:
  security:
    oauth2:
      client:
        registration:
          microservice:
            provider: keycloak
            client-id: microservice-app
            client-secret: r1nuVn4HefusLGwHIeRxbdOzdTZLEMvQ
            authorization-grant-type: password
          keycloak:
            client-id: web-app
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            provider: keycloak
            client-secret: hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7
        provider:
          keycloak:
            jwk-set-uri: http://localhost:9999/realms/cvhome/protocol/openid-connect/certs
            authorization-uri: https://auth.${com.asrevo.cvhome.ssl.default-domain}:${server.port}/realms/cvhome/protocol/openid-connect/auth
            token-uri: http://localhost:9999/realms/cvhome/protocol/openid-connect/token
  cloud:
    local:
      discovery:
        enabled: true
        services:
            domain-certificate-manager:
              - url: "http://localhost:8082"
                metadata:
                  service-name: domain-certificate-manager
                  instance: domain-certificate-manager-1
            store:
              - url: "http://localhost:8083"
                metadata:
                  service-name: store
                  instance: store-1
            streamer:
              - url: "http://localhost:8083"
                metadata:
                  service-name: streamer
                  instance: streamer-1
            auth:
              - url: "http://localhost:9999"
                metadata:
                  service-name: auth
                  instance: auth-1
            admin-ui:
              - url: "http://localhost:4200"
                metadata:
                  service-name: admin-ui
                  instance: admin-ui-1
            store-ui:
              - url: "http://localhost:4300"
                metadata:
                  service-name: store-ui
                  instance: store-ui-1
            welcome-ui:
              - url: "http://localhost:4400"
                metadata:
                  service-name: welcome-ui
                  instance: welcome-ui-1
    gateway:
      discovery:
        locator:
          enabled: true
      default-filters:
        - TokenRelay
        - PreserveHostHeader
        - AddResponseHeader=X-Frame-Options, SAMEORIGIN
      routes:
        - id: domain
          order: -1
          uri: lb://domain
          predicates:
            - Path=/domain/**
          filters:
            - StripPrefix=1
        - id: domain-certificate-manager
          order: -1
          uri: lb://domain-certificate-manager
          predicates:
            - Path=/domain-certificate-manager/**
          filters:
            - StripPrefix=1
        - id: store
          order: -1
          uri: lb://store
          predicates:
            - Path=/store/**
          filters:
            - StripPrefix=1
        - id: auth
          order: -1
          uri: lb://auth
          predicates:
            - FHost=auth.${com.asrevo.cvhome.ssl.default-domain}
        - id: realms
          order: -1
          uri: lb://auth
          predicates:
            - Path=/realms/**
          filters:
            - SetRequestHostHeader=auth.${com.asrevo.cvhome.ssl.default-domain}:8443
        - id: resources
          order: -1
          uri: lb://auth
          predicates:
            - Path=/resources/**
        - id: js
          order: -1
          uri: lb://auth
          predicates:
            - Path=/js/**
        - id: welcome-ui
          order: -1
          uri: lb://welcome-ui
          predicates:
            - FHost=www.${com.asrevo.cvhome.ssl.default-domain},${com.asrevo.cvhome.ssl.default-domain}
        - id: admin-ui
          order: -1
          uri: lb://admin-ui
          predicates:
            - FHost=admin.${com.asrevo.cvhome.ssl.default-domain}
        - id: store-ui
          order: -1
          uri: lb://store-ui
          predicates:
            - FHost={domain}.{x},{sub}.{domain}.{x}
          filters:
            - MapHostAsRequestParam=userId
