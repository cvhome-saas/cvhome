    builder = "paketobuildpacks/builder:tiny"
    imageName = "ghcr.io/ashraf-revo/streamer"
    tags = ["ghcr.io/ashraf-revo/streamer:${project.version}", "ghcr.io/ashraf-revo/streamer:latest"]
    docker {
        publishRegistry {
            url = "https://ghcr.io"
