plugins {
    alias(libs.plugins.java.library.conventions)
}

dependencies {
    // api, not compileOnly: the uaa API's exception types appear in UserAccountService's signature, so every consumer
    // needs them on its runtime classpath to catch them.
    api project(':store-commons:errors')
    compileOnly project(":store-commons:commons")
    implementation libs.mapstruct
    compileOnly libs.lombok
    annotationProcessor libs.mapstruct.processor
    annotationProcessor libs.lombok
    annotationProcessor libs.lombok.mapstruct.binding
}
