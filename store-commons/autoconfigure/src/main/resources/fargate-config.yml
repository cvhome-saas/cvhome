spring:
  datasource:
    url: jdbc:postgresql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.database}
  cloud:
    loadbalancer:
      eager-load:
        clients:
          - "store-core-gateway"
          - "uaa"
          - "tenancy"
          - "billing"
          - "pod-registry"
          - "console-ui"
          - "spg"
          - "merchant"
          - "content"
          - "catalog"
          - "checkout"
          - "cua"
          - "payment"
          - "inventory"
          - "landing-ui"
    ecs:
      discovery:
        # Supplied by the environment. Terraform injects both as
        # SPRING_CLOUD_ECS_DISCOVERY_NAMESPACE and ..._NAMESPACE-ID, per service.
        #
        # These were previously hardcoded to a real namespace and a real namespace id
        # (store-pod-507f1f77.cvhome.lcl / ns-je7qri6wn7fbsrpn) from one specific pod
        # in one specific AWS account. Any other environment silently resolved
        # discovery against a namespace that did not exist for it.
        namespace: ${SPRING_CLOUD_ECS_DISCOVERY_NAMESPACE:}
        namespace-id: ${SPRING_CLOUD_ECS_DISCOVERY_NAMESPACE_ID:}
        enabled: true
        default-port: 8080
        service-ports:
          "uaa": 8001
          "store-core-gateway": 8000
          "console-ui": 8011
          "tenancy": 8020
          "billing": 8021
          "pod-registry": 8022
          "landing-ui": 8110
          "merchant": 8120
          "content": 8121
          "catalog": 8122
          "checkout": 8123
          "cua": 8124
          "payment": 8125
          "inventory": 8126
logging:
  level:
    com.asrevo: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
