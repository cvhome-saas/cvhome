spring:
  datasource:
    url: jdbc:postgresql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.database}
  cloud:
    loadbalancer:
      eager-load:
        clients:
          - "store-core-gateway"
          - "core-auth"
          - "manager"
          - "subscription"
          - "store-ui"
          - "welcome-ui"
          - "store-pod-gateway"
          - "pod-auth"
          - "merchant"
          - "content"
          - "catalog"
          - "order"
          - "landing-ui"
          - "merchant-ui"
    ecs:
      discovery:
        namespace: "store-pod-1.cvhome.lcl"
        namespace-id: "ns-je7qri6wn7fbsrpn"
        enabled: true
        default-port: 8080
        service-ports:
          "core-auth": 8001
          "store-core-gateway": 8000
          "store-ui": 8010
          "welcome-ui": 8011
          "manager": 8020
          "subscription": 8021
          "store-pod-gateway": 8100
          "pod-auth": 8101
          "landing-ui": 8110
          "merchant-ui": 8111
          "merchant": 8120
          "content": 8121
          "catalog": 8122
          "order": 8123
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false