spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cvhome
    username: postgres
    password: password
  cloud:
    discovery:
      client:
        simple:
          instances:
            uaa:
              - uri: "http://localhost:8001"
                instance-id: uaa-1
                metadata:
                  service-name: uaa
                  instance: uaa-1
            tenancy:
              - uri: "http://localhost:8020"
                instance-id: tenancy-1
                metadata:
                  service-name: tenancy
                  instance: tenancy-1
            billing:
              - uri: "http://localhost:8021"
                instance-id: billing-1
                metadata:
                  service-name: billing
                  instance: billing-1
            pod-registry:
              - uri: "http://localhost:8022"
                instance-id: pod-registry-1
                metadata:
                  service-name: pod-registry
                  instance: pod-registry-1
            seller-ui:
              - uri: "http://localhost:8010"
                instance-id: seller-ui-1
                metadata:
                  service-name: seller-ui
                  instance: seller-ui-1
            store-core-gateway:
              - uri: "http://localhost:8000"
                instance-id: store-core-gateway-1
                metadata:
                  service-name: store-core-gateway
                  instance: store-core-gateway-1
            # The same gateway under its namespace-qualified name. ServiceUrlBuilder addresses a service in another
            # namespace as lb://<gateway>.<gateway-namespace>/<service>, which Cloud Map resolves on Fargate but the
            # local SimpleDiscoveryClient only knows if it is listed. Needed since the pods began calling billing —
            # the first store-pod to store-core call in the platform, and until then nothing exercised this path.
            store-core-gateway.store-core.cvhome.lcl:
              - uri: "http://localhost:8000"
                instance-id: store-core-gateway-ns-1
                metadata:
                  service-name: store-core-gateway
                  instance: store-core-gateway-ns-1
            merchant:
              - uri: "http://localhost:8120"
                instance-id: merchant-1
                metadata:
                  service-name: merchant
                  instance: merchant-1
            content:
              - uri: "http://localhost:8121"
                instance-id: content-1
                metadata:
                  service-name: content
                  instance: content-1
            catalog:
              - uri: "http://localhost:8122"
                instance-id: catalog-1
                metadata:
                  service-name: catalog
                  instance: catalog-1
            checkout:
              - uri: "http://localhost:8123"
                instance-id: checkout-1
                metadata:
                  service-name: checkout
                  instance: checkout-1
            cua:
              - uri: "http://localhost:8124"
                instance-id: cua-1
                metadata:
                  service-name: cua
                  instance: cua-1
            payment:
              - uri: "http://localhost:8125"
                instance-id: payment-1
                metadata:
                  service-name: payment
                  instance: payment-1
            landing-ui:
              - uri: "http://localhost:8110"
                instance-id: landing-ui-1
                metadata:
                  service-name: landing-ui
                  instance: landing-ui-1
