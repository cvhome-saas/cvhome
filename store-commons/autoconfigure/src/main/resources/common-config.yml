server:
  forward-headers-strategy: NATIVE
  port: ${com.asrevo.cvhome.services.${spring.application.name}.port}

springdoc:
  show-actuator: true
  api-docs:
    path: /api-docs
management:
  observations:
    key-values:
      application: ${spring.application.name}
  info:
    env:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: [ '*' ]
          #logging:
          #  level:
          #    org.springframework.boot: debug
          #    org.springframework.web: debug
          #    org.springframework.cloud.gateway: debug
          #    org.springframework.security: debug
          #    reactor.netty.http: debug
info:
  app:
    name: ${spring.application.name}
otel:
  sdk:
    disabled: true
  resource:
    attributes:
      service:
        name: ${spring.application.name}
  instrumentation:
    spring-webmvc:
      experimental-span-attributes: true
    spring-cloud-gateway:
      experimental-span-attributes: true
    spring-webflux:
      experimental-span-attributes: true
logging:
  level:
    com:
      asrevo: DEBUG