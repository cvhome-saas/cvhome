spring:
  docker:
    compose:
      file: ${spring.application.name}/compose.yml
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: ${spring.application.name}
  session:
    jdbc:
      initialize-schema: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  cloud:
    function:
      definition: events
    stream:
      input-bindings: events
      bindings:
        events-in-0:
          destination: events
          group: ${spring.application.name}
        events-out-0:
          content-type: application/json
          destination: events
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          predicate:
            host:
              include-port: false
  security:
    oauth2:
      client:
        registration:
          uaa:
            client-id: web-app
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: openid
            redirect-uri: "{baseUrl}/login/oauth2/code/uaa"
            provider: uaa
            client-secret: hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7
        provider:
          uaa:
            #            comment issuer-uri to skip validation
            #            issuer-uri: ${com.asrevo.cvhome.services.uaa.schema}://${com.asrevo.cvhome.services.uaa.domain}:${com.asrevo.cvhome.services.uaa.port}
            jwk-set-uri: ${com.asrevo.cvhome.services.uaa.schema}://${com.asrevo.cvhome.services.uaa.domain}:${com.asrevo.cvhome.services.uaa.port}/oauth2/jwks
            authorization-uri: ${com.asrevo.cvhome.services.uaa.schema}://${com.asrevo.cvhome.services.uaa.domain}:${com.asrevo.cvhome.services.uaa.port}/oauth2/authorize
            user-info-uri: ${com.asrevo.cvhome.services.uaa.schema}://${com.asrevo.cvhome.services.uaa.domain}:${com.asrevo.cvhome.services.uaa.port}/userinfo
            token-uri: ${com.asrevo.cvhome.services.uaa.schema}://${com.asrevo.cvhome.services.uaa.domain}:${com.asrevo.cvhome.services.uaa.port}/oauth2/token
            end-session-endpoint: ${com.asrevo.cvhome.services.uaa.schema}://${com.asrevo.cvhome.services.uaa.domain}:${com.asrevo.cvhome.services.uaa.port}/connect/logout
            user-name-attribute: sub
      resourceserver:
        jwt:
          issuer-uri-set:
            - ${com.asrevo.cvhome.services.uaa.schema}://${com.asrevo.cvhome.services.uaa.domain}
            - ${com.asrevo.cvhome.services.uaa.schema}://${com.asrevo.cvhome.services.uaa.domain}:${com.asrevo.cvhome.services.uaa.port}
server:
  forward-headers-strategy: NATIVE
  port: ${com.asrevo.cvhome.services.${spring.application.name}.port}

springdoc:
  show-actuator: true
  api-docs:
    path: /api-docs
management:
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      jvm: false
  observations:
    key-values:
      application: ${spring.application.name}
  info:
    env:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: [ '*' ]
info:
  app:
    name: ${spring.application.name}
otel:
  sdk:
    disabled: true
  resource:
    attributes:
      service.name: ${spring.application.name}
    disabled:
      keys: process.command,process.command_args,process.command_line,process.executable.name,process.executable.path,process.owner,process.parent_pid,process.pid,process.runtime.description,process.runtime.name,process.runtime.version,telemetry.distro.name,telemetry.distro.version,telemetry.sdk.language,telemetry.sdk.name,telemetry.sdk.version
  instrumentation:
    runtime-metrics:
      enabled: false
    jvm-metrics:
      enabled: false
    micrometer:
      enabled: true
logging:
  level:
    com.asrevo: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG