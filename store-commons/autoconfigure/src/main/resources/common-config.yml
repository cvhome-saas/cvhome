spring:
  docker:
    compose:
      file: ${spring.application.name}/compose.yml
  sql:
    init:
      mode: always

springdoc:
  show-actuator: true
  api-docs:
    path: /api-docs
management:
  info:
    env:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: [ '*' ]
