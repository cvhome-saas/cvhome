plugins {
    alias(libs.plugins.java.library.conventions)
}

dependencies {
    compileOnly project(":store-commons:commons")
    api project(":store-commons:errors")
    compileOnly project(":store-commons:ecs-commons:fargate-task-info")
    compileOnly libs.spring.webflux
    compileOnly libs.spring.webmvc
    compileOnly libs.jakarta.servlet.api
    compileOnly libs.spring.boot.starter.jackson
    compileOnly libs.spring.data.commons
    compileOnly libs.spring.boot.starter.oauth2.client
    compileOnly libs.spring.boot.starter.security.oauth2.resource.server
    compileOnly libs.spring.cloud.gateway.server.webflux
    compileOnly libs.spring.cloud.commons
    compileOnly libs.spring.boot.starter.actuator
    compileOnly libs.jackson.databind
    compileOnly libs.jackson.core
    compileOnly libs.swagger.models

    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // The custom argument resolvers reference domain types from :store-commons:commons, which is compileOnly
    // here; a client proxy cannot be invoked at test time without them on the runtime classpath.
    testImplementation project(':store-commons:commons')
    // WebClientsUtils touches both client stacks, so the s2s round-trip test needs webflux on the test
    // classpath even though production consumers only ever use one of them.
    testImplementation libs.spring.webflux
    testImplementation libs.spring.boot.starter.web
    testImplementation libs.spring.boot.starter.validation
    testImplementation libs.spring.boot.starter.security
    testImplementation libs.spring.boot.starter.test
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
    // Version pinned explicitly: the shared catalog entry is versionless because every other module inherits it from
    // the Spring Boot BOM, which this java-library module does not apply. Keep in step with the JUnit Jupiter version
    // spring-boot-starter-test resolves to.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.1'
}

// This module applies the plain java-library conventions rather than the Spring Boot plugin, so the JUnit Platform
// has to be selected explicitly here instead of being configured by Boot's dependency management.
tasks.named('test') {
    useJUnitPlatform()
}
