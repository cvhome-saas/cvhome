plugins {
    alias(libs.plugins.java.library.conventions)
}

// common-config.yml tags every metric, span and log line with the build version. Spring has no property named
// `version`, so the file carries an @version@ token that Gradle fills in from project.version here. ReplaceTokens
// touches only @...@ tokens; expand() would also try to resolve every ${...} Spring placeholder in the file.
processResources {
    filesMatching('common-config.yml') {
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [version: project.version.toString()])
    }
}

dependencies {
    compileOnly project(":store-commons:commons")
    api project(":store-commons:errors")
    compileOnly project(":store-commons:ecs-commons:fargate-task-info")
    compileOnly libs.spring.webflux
    compileOnly libs.spring.webmvc
    compileOnly libs.jakarta.servlet.api
    compileOnly libs.spring.boot.starter.jackson
    compileOnly libs.spring.data.commons
    // org.springframework.dao lives here; DataIntegrityErrorHandler is @ConditionalOnClass so services without it
    // simply do not get that advice.
    compileOnly libs.spring.tx
    compileOnly libs.spring.boot.starter.oauth2.client
    compileOnly libs.spring.boot.starter.security.oauth2.resource.server
    compileOnly libs.spring.cloud.gateway.server.webflux
    compileOnly libs.spring.cloud.commons
    compileOnly libs.spring.boot.starter.actuator
    // OutboxMetrics counts outbox rows through a JdbcTemplate; only services that enable cvhome.metrics.outbox have one.
    compileOnly libs.spring.jdbc
    // TraceContextMdcFilter reads the current span; the API is on every service's runtime classpath via the starter.
    compileOnly libs.io.opentelemetry.api
    // With this library on the classpath the OpenTelemetry starter wraps the root logger's appenders with its MDC
    // appender, so console lines from any thread (scheduled work, outbox handlers) print trace_id/span_id. Request
    // threads additionally get the ids in the real MDC from TraceContextMdcFilter, which is what the ProblemDetail
    // traceId reads. Runtime for every service that imports this module.
    implementation libs.io.opentelemetry.instrumentation.logback.mdc
    compileOnly libs.jackson.databind
    compileOnly libs.jackson.core
    compileOnly libs.swagger.models

    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // Everything above is compileOnly, so the tests need their own copies of what the code under test touches:
    // the value objects, and the resource-server types that make a JwtAuthenticationToken constructible.
    testImplementation project(":store-commons:commons")
    testImplementation libs.spring.boot.starter.security.oauth2.resource.server
    // The error contract is the largest block of real logic here and none of it is constructible without the web
    // stack: ProblemDetail and ResponseEntityExceptionHandler come from spring-webmvc, the handlers take a
    // ServletRequest, and the bodies are asserted as JSON.
    testImplementation libs.spring.webmvc
    testImplementation libs.jakarta.servlet.api
    testImplementation libs.jackson.databind
    testImplementation libs.spring.tx
    // ConstraintViolationErrorHandler's advice is keyed on jakarta.validation types.
    testImplementation libs.jakarta.validation.api
    // EcsTaskHealthIndicator is a HealthIndicator over an EcsTask; both are compileOnly above.
    testImplementation libs.spring.boot.starter.actuator
    testImplementation project(":store-commons:ecs-commons:fargate-task-info")
    // The reactive decoder and the gateway's logout handler are Mono-shaped; StepVerifier is how they are
    // asserted without blocking.
    testImplementation libs.spring.webflux
    testImplementation libs.reactor.test
    testImplementation libs.spring.data.commons
    testImplementation libs.spring.jdbc
    testImplementation libs.io.opentelemetry.api
}
