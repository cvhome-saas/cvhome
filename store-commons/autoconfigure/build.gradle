plugins {
	id 'com.asrevo.java-library-conventions'
	id("com.diffplug.spotless") version "6.25.0"
}

dependencies {
	compileOnly project(":store-commons:commons")
	compileOnly project(":store-commons:ecs-commons:fargate-task-info")
	compileOnly 'org.springframework:spring-webflux:6.2.6'
	compileOnly 'org.springframework:spring-webmvc:6.2.6'
	compileOnly 'org.springframework.data:spring-data-commons:3.4.5'
	compileOnly 'org.springframework.boot:spring-boot-starter-oauth2-client:3.4.5'
	compileOnly 'org.springframework.cloud:spring-cloud-gateway-server:4.2.2'
	compileOnly 'org.springframework.cloud:spring-cloud-commons:4.2.1'
	compileOnly 'org.springframework.boot:spring-boot-starter-actuator:3.4.5'
	compileOnly 'org.springframework.cloud:spring-cloud-stream:4.2.1'
	compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
	compileOnly 'com.fasterxml.jackson.core:jackson-core:2.18.3'
	compileOnly 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.18.3'
	compileOnly 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.3'
//    compileOnly 'org.springdoc:springdoc-openapi-starter-common:2.8.6'
	compileOnly 'io.swagger.core.v3:swagger-models:2.2.8'

	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'
}
