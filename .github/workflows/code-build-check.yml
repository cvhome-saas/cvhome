# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Code Build Check

on:
  pull_request:
    branches:
      - 'develop'
      - 'main'
      - '0.*.*'
      - '1.*.*'
      - '2.*.*'
  push:
    branches:
      - 'develop'
      - 'main'
  workflow_dispatch:

# A new push supersedes the run still in flight for the same branch or PR: the older
# commit's result is not the one the PR is judged on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Package And Publish Docker with Gradle
        run: ./gradlew build -x test -x check

