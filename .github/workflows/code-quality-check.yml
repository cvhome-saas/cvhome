name: Code Quality Check

on:
  pull_request:
    branches:
      - 'develop'
      - 'main'
      - '0.*.*'
      - '1.*.*'
      - '2.*.*'
  push:
    branches:
      - 'develop'
      - 'main'
  workflow_dispatch:

# A new push supersedes the run still in flight for the same branch or PR: the older
# commit's result is not the one the PR is judged on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Checkstyle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Check with Gradle
        run: ./gradlew checkstyleMain checkstyleTest checkstyleIntegrationTest

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: build/reports/checkstyle/*
          if-no-files-found: error
          retention-days: 14

  monitoring:
    name: Monitoring config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The dashboards JSON and docs/dashboards.md are generated from dashboards.spec.mjs; a stale file fails here.
      - name: Dashboards match their spec and their docs
        run: |
          node extra/monitoring/scripts/build-dashboards.mjs --check
          node extra/monitoring/scripts/dashboard-docs.mjs --check

      - name: Prometheus rules and config
        run: |
          docker run --rm -v "$PWD/extra/monitoring/prometheus-rules:/r:ro" --entrypoint promtool prom/prometheus:v3.11.2 check rules /r/cvhome-recording.yml /r/cvhome-alerts.yml
          docker run --rm -v "$PWD/extra/monitoring/prometheus-rules:/r:ro" --entrypoint promtool prom/prometheus:v3.11.2 test rules /r/tests/cvhome.test.yml
          docker run --rm -v "$PWD/extra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" --entrypoint promtool prom/prometheus:v3.11.2 check config --syntax-only /etc/prometheus/prometheus.yml

      - name: Collector config
        run: docker run --rm -v "$PWD/extra/monitoring/logging-otel-collector-config.yml:/etc/c.yml:ro" otel/opentelemetry-collector-contrib:0.150.1 validate --config=/etc/c.yml
