name: Code Unit And Integration Test Check

on:
  pull_request:
    branches:
      - 'develop'
      - 'main'
      - '0.*.*'
      - '1.*.*'
      - '2.*.*'
  push:
    branches:
      - 'develop'
      - 'main'
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # src/test only: no Docker, no Spring context. Includes the *ArchitectureTest layering rules.
      - name: Run unit tests
        run: ./gradlew test verifyTestNaming --continue

      - name: Publish unit test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: Unit test results

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # src/integrationTest: full Spring context on Testcontainers (Postgres, MinIO). ubuntu-latest ships Docker.
      - name: Run integration tests
        run: ./gradlew integrationTest --continue

      - name: Publish integration test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/build/test-results/integrationTest/TEST-*.xml'
          check_name: Integration test results

  coverage:
    name: Coverage reports
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # One report per micro service, plus the whole-monorepo aggregate.
      - name: Generate coverage reports
        run: ./gradlew coverageReport perServiceCoverage jacocoTestCoverageVerification

      - name: Upload per-service coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-per-service
          path: build/reports/coverage/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-aggregate
          path: build/reports/jacoco/aggregate/**
          if-no-files-found: error
          retention-days: 14
