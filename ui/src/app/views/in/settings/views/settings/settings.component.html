<div class="d-flex">
  <div class="w-25 d-none d-lg-block border-end user-chat-box">
    <div class="overflow-auto " style="height: calc(100vh - 262px)" data-simplebar="init">
      <ul>
        <li>
          <a routerLink="/in/settings" [routerLinkActive]="['bg-light']"
             [routerLinkActiveOptions]="{ exact: true }"
             class="p-3 border-bottom d-flex ">
            <div class="ms-3 d-inline-block w-75">
              <h6 class="mb-0">Domain Settings</h6>
            </div>
          </a>
        </li>
        <li>
          <a routerLink="/in/settings/channels" [routerLinkActive]="['bg-light']"
             [routerLinkActiveOptions]="{ exact: true }"
             class="p-3 border-bottom d-flex ">
            <div class="ms-3 d-inline-block w-75">
              <h6 class="mb-0">Channels Settings</h6>
            </div>
          </a>
        </li>
      </ul>
    </div>
  </div>
  <div class="w-75 w-xs-100 chat-container">
    <div class="p-3">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
