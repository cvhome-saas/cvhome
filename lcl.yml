# lcl.yml — the local stack, as run by ./extra/scripts/lcl (engine in extra/lcl, project-agnostic).
#
# Every service here is started, supervised, health-checked and logged by lcl. Ports are declared per service
# (keep them equal to common-config.yml, which the Spring services bind); when a port is taken the whole stack
# shifts by `ports.step` × k (gateway 9000, catalog 9122, postgres 6432 …) and every ${port.<service>} follows.
#
# Variables usable in strings: ${stack} ${stack.dir} ${root} ${project} ${offset} ${service} ${port}
#                              ${port.<service>} ${port.<compose service>:<container port>} ${env.NAME}

name: cvhome

ports:
  step: 1000
  skip-configured: false             # true: never use the ports above, always start at +step (or `--no-default-ports`)

build: [./gradlew, build, -x, test, -x, check, --console=plain]   # `lcl start --build`

compose:
  file: docker-compose-lcl.yml
  default: [postgres, minio, spg]    # `lcl start`; `--infra all` starts every compose service, `--infra a,b` a subset
  env:                               # extra entries for the compose env file (LCL_PORT_<SERVICE> is always there)
    NAMESPACE: gateway.com

defaults:
  gradle:
    task: bootRun
    args:
      # `lcl` is the environment slice, `test-stores` seeds the demo orgs/stores and users the local hostnames point at.
      - "--args=--spring.profiles.active=lcl,test-stores"
      # separate Gradle task state per stack, so two stacks can run the same module from this checkout
      - "--project-cache-dir=${stack.dir}/gradle"
      - "--console=plain"
    health: { path: /actuator/health, expect: '"status":"UP"', ready-log: 'Started \S+ in [\d.]+ seconds', timeout: 300 }
    env:
      # Spring reads SPRING_APPLICATION_JSON from the environment with the highest precedence, so this is how every
      # Spring service learns this stack's ports: its own port, every other service's port, the local discovery table,
      # the datasource, MinIO and the pod endpoint. Lists (handlers, pods, discovery entries) are replaced, not merged,
      # by a higher-precedence source, so each list element is spelled out completely.
      SPRING_APPLICATION_JSON: >-
        {
          "com.asrevo.cvhome.app.handlers[0].schema": "http",
          "com.asrevo.cvhome.app.handlers[0].port": ${port.store-core-gateway},
          {{#each services}}
          "com.asrevo.cvhome.services.{{name}}.port": {{port}},
          "spring.cloud.discovery.client.simple.instances.{{name}}[0].uri": "http://localhost:{{port}}",
          "spring.cloud.discovery.client.simple.instances.{{name}}[0].instance-id": "{{name}}-1",
          "spring.cloud.discovery.client.simple.instances.{{name}}[0].metadata.service-name": "{{name}}",
          "spring.cloud.discovery.client.simple.instances.{{name}}[0].metadata.instance": "{{name}}-1",
          {{/each}}
          "spring.cloud.discovery.client.simple.instances[store-core-gateway.store-core.cvhome.lcl][0].uri": "http://localhost:${port.store-core-gateway}",
          "spring.cloud.discovery.client.simple.instances[store-core-gateway.store-core.cvhome.lcl][0].instance-id": "store-core-gateway-ns-1",
          "spring.cloud.discovery.client.simple.instances[store-core-gateway.store-core.cvhome.lcl][0].metadata.service-name": "store-core-gateway",
          "spring.cloud.discovery.client.simple.instances[store-core-gateway.store-core.cvhome.lcl][0].metadata.instance": "store-core-gateway-ns-1",
          "spring.datasource.url": "jdbc:postgresql://localhost:${port.postgres:5432}/cvhome",
          "com.asrevo.cvhome.cdn.storage.s3-url": "http://localhost:${port.minio:9000}",
          "com.asrevo.cvhome.cdn.base-path": "http://localhost:${port.minio:9000}/d0dd4299-963a-4458-b31f-8efe31c35e8e",
          "com.asrevo.cvhome.pods[0].id": "507f1f77bcf86cd799439011",
          "com.asrevo.cvhome.pods[0].name": "pod-507f1f77",
          "com.asrevo.cvhome.pods[0].domain": "spg-507f1f77.gateway.com",
          "com.asrevo.cvhome.pods[0].endpoint.endpoint": "http://spg-507f1f77.gateway.com:${port.spg}",
          "com.asrevo.cvhome.pods[0].endpoint.type": "EXTERNAL",
          "com.asrevo.cvhome.pod-info.pod.id": "507f1f77bcf86cd799439011",
          "com.asrevo.cvhome.pod-info.pod.name": "pod-507f1f77",
          "com.asrevo.cvhome.pod-info.pod.domain": "spg-507f1f77.gateway.com",
          "com.asrevo.cvhome.pod-info.pod.endpoint.endpoint": "http://spg-507f1f77.gateway.com:${port.spg}",
          "com.asrevo.cvhome.pod-info.pod.endpoint.type": "EXTERNAL",
          "management.otlp.tracing.endpoint": "http://localhost:${port.otel-collector:4318}/v1/traces",
          "management.otlp.metrics.export.url": "http://localhost:${port.otel-collector:4318}/v1/metrics",
          "otel.exporter.otlp.endpoint": "http://localhost:${port.otel-collector:4317}"
        }
  npm:
    health: { timeout: 240 }

services:
  # store-core — uaa first: it issues the tokens everything else validates
  uaa:                { type: gradle, port: 8001, module: ":store-core:uaa" }
  store-core-gateway: { type: gradle, port: 8000, module: ":store-core:gateway:gateway-service",       after: [uaa] }
  tenancy:            { type: gradle, port: 8020, module: ":store-core:tenancy:tenancy-service",       after: [uaa] }
  billing:            { type: gradle, port: 8021, module: ":store-core:billing:billing-service",       after: [uaa] }
  pod-registry:       { type: gradle, port: 8022, module: ":store-core:pod-registry:pod-registry-service", after: [uaa] }
  console-ui:
    type: npm
    port: 8011
    dir: store-core/console-ui
    command: [npx, ng, serve, --port, "${port}"]
    after: [uaa]
  # store-pod
  spg:                { type: container, port: 80, compose: spg }
  merchant:           { type: gradle, port: 8120, module: ":store-pod:merchant:merchant-service",      after: [uaa] }
  content:            { type: gradle, port: 8121, module: ":store-pod:content:content-service",        after: [uaa] }
  catalog:            { type: gradle, port: 8122, module: ":store-pod:catalog:catalog-service",        after: [uaa] }
  checkout:           { type: gradle, port: 8123, module: ":store-pod:checkout:checkout-service",      after: [uaa] }
  cua:                { type: gradle, port: 8124, module: ":store-pod:cua",                            after: [uaa] }
  payment:            { type: gradle, port: 8125, module: ":store-pod:payment:payment-service",        after: [uaa] }
  inventory:          { type: gradle, port: 8126, module: ":store-pod:inventory:inventory-service",    after: [uaa] }
  landing-ui:
    type: npm
    port: 8110
    dir: store-pod/landing-ui/storefront
    install: store-pod/landing-ui                # workspace root that owns node_modules
    # libs are consumed as built output (dist/); tsc -b is incremental so rebuilding every start is cheap
    prep:
      - { dir: store-pod/landing-ui, command: [npm, run, build:libs-types] }
      - { dir: store-pod/landing-ui, command: [npm, run, build:libs-services] }
      - { dir: store-pod/landing-ui, command: [npm, run, build:libs-hooks] }
    command: [npx, next, dev, -p, "${port}", --turbopack]
    env:
      INTERNAL_SPG: "http://spg-507f1f77.gateway.com:${port.spg}"
      NEXT_DIST_DIR: ".next-${stack}"           # read by storefront/next.config.ts: one .next per stack
    after: [uaa]

hooks:
  after-up:
    # uaa's seeded `web-app` OAuth client pins its redirect URIs to the configured gateway port; on a shifted stack
    # rewrite them to this stack's gateway port (Spring Authorization Server reads clients from JDBC per request).
    - service: uaa
      when: "${offset} != 0"
      shell: >-
        docker compose -p ${project} -f ${compose.file} exec -T postgres
        psql -v ON_ERROR_STOP=1 -U postgres -d cvhome -c
        "update uaa.oauth2_registered_client set
           redirect_uris = 'http://localhost:${port.store-core-gateway}/login/oauth2/code/uaa,http://gateway.com:${port.store-core-gateway}/login/oauth2/code/uaa,http://console-ui.gateway.com:${port.store-core-gateway}/login/oauth2/code/uaa',
           post_logout_redirect_uris = 'http://localhost:${port.store-core-gateway},http://gateway.com:${port.store-core-gateway},http://console-ui.gateway.com:${port.store-core-gateway}'
         where client_id = 'web-app'"

urls:
  - { label: seller console, url: "http://gateway.com:${port.store-core-gateway}" }
  - { label: uaa,            url: "http://uaa.gateway.com:${port.uaa}" }
  - { label: storefront,     url: "http://org1-store1.spg-507f1f77.gateway.com:${port.spg}" }
  - { label: pod gateway,    url: "http://spg-507f1f77.gateway.com:${port.spg}" }
  - { label: minio console,  url: "http://localhost:${port.minio:9001}" }
  - { label: grafana,        url: "http://localhost:${port.grafana:3000}" }
  - { label: postgres,       url: "postgresql://postgres:password@localhost:${port.postgres:5432}/cvhome" }
