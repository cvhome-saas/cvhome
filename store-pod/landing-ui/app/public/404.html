<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            background-color: #fdfdfd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            font-size: 6rem;
            font-weight: 700;
            margin: 0;
            color: #ff6b6b;
        }

        p {
            font-size: 1.2rem;
            color: #666;
            margin-top: 1rem;
        }

        p.details {
            font-size: 1rem;
            color: #6c757d;
        }
        p.message {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 25px;
            color: #555;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p class="message">Store Not Found</p>
        <p class="details">The store you're looking for doesn't exist or is unavailable.</p>
    </div>
</body>
</html>
