    @TaskAction
    void bootBuildImage() {
        String image = "${System.getenv('REGISTRY')}/store-pod/${project.name}"
        project.exec {
            workingDir '.'
            commandLine "docker", "build", "-t", "${image}:${project.version}", "-t", "${image}:latest", "."
        }
        if (publishImage) {
            project.exec {
                workingDir '.'
                commandLine "docker", "push", image, "--all-tags"
            }
        }
    }

}
