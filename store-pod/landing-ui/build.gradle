task "clean" {
    doLast {
        delete files('dist/')
    }
}

task "build" {
    doLast {
        exec {
            workingDir '.'
            commandLine "npm", "i"
        }
        exec {
            workingDir '.'
            commandLine "npm", "run", "build"
        }
    }
}

tasks.register('bootBuildImage', BootBuildImageTask) {
    dependsOn('build')
}


abstract class BootBuildImageTask extends DefaultTask {
