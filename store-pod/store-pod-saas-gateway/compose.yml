version: '3'
services:
  saas-gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: true
    network_mode: "host"
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    environment:
      NAMESPACE: gateway.com
      ASK_TLS_URL: http://gateway.com:8000/manager/api/v1/router/public/ask-for-tls
      ACME_CA_URL: https://acme-staging-v02.api.letsencrypt.org/directory
      DOMAIN_LOOKUP_URL: http://gateway.com:8000/manager/api/v1/router/public/lookup-by-domain
      CERT_BUCKET: random-bucket
      CERT_BUCKET_REGION: eu-central-1