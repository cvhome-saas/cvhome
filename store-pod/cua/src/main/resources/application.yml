spring:
  application:
    name: cua
  config:
    import: "classpath:common-config.yml"
  security:
    oauth2:
      client:
        registration:
          s2s:
            provider: uaa
            client-id: store-pod-507f1f77@service.store-pod.internal
            client-secret: hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7
            authorization-grant-type: client_credentials
            scope: store_pod
  sql:
    init:
      schema-locations: classpath:init-sql/schema.sql
      data-locations: classpath:init-sql/data-common.sql
  jpa:
    properties:
      hibernate:
        default_schema: ${spring.application.name}
com:
  asrevo:
    cvhome:
      sso:
        # cua is the multi-realm deployment of the SSO server: one realm per store, resolved from the storefront
        # host the shopper is on. uaa is the same code with a single realm. Stated explicitly because the property
        # has no default — a deployment that forgot to say would otherwise pick one, and picking SINGLE here would
        # put every store's shoppers into one pool.
        realm:
          mode: MULTI
      uaa:
        # Shared with uaa's namespace because the settings belong to the server, not to either deployment.
        # Registration is a shopper-facing flow here, so the links a store issues point at the storefront.
        links:
          invitation-validity: P7D
          reset-validity: PT1H
        rate-limit:
          enabled: true
        remember-me:
          key: ${CUA_REMEMBER_ME_KEY:cua-local-remember-me-key-not-for-deployment}
