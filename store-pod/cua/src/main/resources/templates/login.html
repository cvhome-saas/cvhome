<!DOCTYPE html>
<html th:dir="${#locale.language == 'ar' ? 'rtl' : 'ltr'}" th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{login.title}">Login</title>
    <link href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAMCAYAAABWdVznAAAAFklEQVQYV2P8z8DAwMDAwMDAwMAAEYACV6tDkYAAAAAElFTkSuQmCC"
          rel="icon"
          type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 1.5rem;
            text-align: center;
            color: #333;
        }

        form {
            display: grid;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 0.25rem;
            font-weight: bold;
        }

        input {
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error {
            color: red;
            margin-bottom: 1rem;
            text-align: center;
        }

        .store-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .store-logo {
            max-width: 96px;
            max-height: 96px;
            object-fit: contain;
            border-radius: 8px;
        }

        .store-name {
            margin: 0;
            text-align: center;
            color: #333;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .social-login {
            margin-top: 1.5rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
            display: grid;
            gap: 0.5rem;
        }

        .social-button {
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            text-align: center;
            text-decoration: none;
            color: #333;
            background-color: white;
        }

        .social-button:hover {
            background-color: #f8f9fa;
        }

        .footer {
            margin-top: 1.5rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .footer a {
            color: #007bff;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* RTL Specific Adjustments */
        [dir="rtl"] .form-group label {
            text-align: right;
        }

        [dir="rtl"] input {
            text-align: right;
        }
    </style>
    <link href="../css/login.css" rel="stylesheet">
</head>
<body>
<div class="login-container">
    <div class="store-header" th:if="${store}">
        <img class="store-logo"
             th:alt="#{login.store.logo.alt(${store.name})}"
             th:if="${storeLogo != null}"
             th:src="${storeLogo}"/>
        <h2 class="store-name" th:text="${store.name}">Store Name</h2>
    </div>

    <h2 th:if="${store == null}" th:text="#{login.header}">Login</h2>

    <div class="error" th:if="${param.error}" th:text="#{login.error.invalid}">
        Invalid username or password.
    </div>

    <form method="post" th:action="@{/login}">
        <input name="client_id" th:value="${clientId}" type="hidden">
        <div class="form-group">
            <label for="username" th:text="#{login.username}">Username</label>
            <input autofocus id="username" name="username" required type="text"/>
        </div>
        <div class="form-group">
            <label for="password" th:text="#{login.password}">Password</label>
            <input id="password" name="password" required type="password"/>
        </div>
        <button th:text="#{login.button.signin}" type="submit">Sign In</button>
    </form>

    <div class="social-login" th:if="${socialLogins}">
        <div style="text-align: center; margin-bottom: 0.5rem; color: #666; font-size: 0.8rem;"
             th:text="#{login.social.or}">OR
        </div>
        <a class="social-button"
           th:each="login : ${socialLogins}"
           th:href="@{/oauth2/authorization/{id}(id=${login.toRegistrationId()})}"
           th:text="#{login.social.signinwith(#{'provider.' + ${#strings.toLowerCase(login.providerId)}})}"></a>
    </div>

    <div class="footer">
        <span th:text="#{login.footer.noaccount}">Don't have an account?</span>
        <a th:href="@{/register}" th:text="#{login.footer.signup}">Sign Up</a>
    </div>
</div>
</body>
</html>
