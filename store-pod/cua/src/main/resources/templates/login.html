<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .login-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-bottom: 1.5rem; text-align: center; color: #333; }
        form { display: grid; gap: 1rem; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 0.25rem; font-weight: bold; }
        input { padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.75rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        .error { color: red; margin-bottom: 1rem; text-align: center; }
        .client-info { margin-bottom: 1rem; padding: 0.5rem; background-color: #e9ecef; border-radius: 4px; font-size: 0.9rem; text-align: center; }
        .social-login { margin-top: 1.5rem; border-top: 1px solid #eee; padding-top: 1rem; display: grid; gap: 0.5rem; }
        .social-button { padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-size: 1rem; text-align: center; text-decoration: none; color: #333; background-color: white; }
        .social-button:hover { background-color: #f8f9fa; }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Login</h2>
    
    <div th:if="${clientId}" class="client-info">
        Logging in to: <strong th:text="${clientId}"></strong>
    </div>

    <div th:if="${param.error}" class="error">
        Invalid username or password.
    </div>

    <form method="post" th:action="@{/login}">
        <input type="hidden" name="client_id" th:value="${clientId}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
        </div>
        <button type="submit">Sign In</button>
    </form>

    <div th:if="${socialLogins}" class="social-login">
        <div style="text-align: center; margin-bottom: 0.5rem; color: #666; font-size: 0.8rem;">OR</div>
        <a th:each="login : ${socialLogins}" 
           th:href="@{/oauth2/authorization/{id}(id=${login.registrationId})}" 
           class="social-button" 
           th:text="'Sign in with ' + ${#strings.capitalize(login.providerId)}"></a>
    </div>
</div>
</body>
</html>
