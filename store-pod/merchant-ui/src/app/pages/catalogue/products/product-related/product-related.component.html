<nb-card>
  <nb-card-body>

    <div *ngIf="params.store">
      <h5 class="mb-3">{{ 'PRODUCT_GROUP.ADD_PRODUCTS' | translate }}</h5>

      <div class="form-group row mb-3">
        <label class="col-sm-4 col-form-label" for="product-autocomplete">{{ 'PRODUCT_GROUP.SEARCH_PRODUCT' | translate }}</label>
        <div class="col-sm-6">
          <ngx-product-auto-complete (onProduct)="onItemSelect($event)" [store]="params.store"/>
        </div>
      </div>

    </div>
    <ngx-datatable
      (page)="setPage($event)"
      [columnMode]="ColumnMode.force"
      [count]="page.totalElements"
      [externalPaging]="true"
      [footerHeight]="50"
      [headerHeight]="50"
      [limit]="page.size"
      [offset]="page.pageNumber"
      [rows]="rows"
      class="material"
      rowHeight="auto">


      <ngx-datatable-column name="name">
        <ng-template let-column="column" ngx-datatable-header-template> {{ 'CONTENT.NAME' |translate }}
        </ng-template>
        <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
          {{ row.sku }}
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column name="actions">
        <ng-template let-column="column" ngx-datatable-header-template>
          {{ 'ORDER.ACTIONS' |translate }}
        </ng-template>
        <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
          <button nbButton (click)="onItemDeSelect(row)" shape="round" size="small" status="danger">
            <nb-icon icon="trash"></nb-icon>
          </button>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>


  </nb-card-body>
</nb-card>
