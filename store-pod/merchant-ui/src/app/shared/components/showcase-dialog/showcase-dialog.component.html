<nb-card>
  <nb-card-header></nb-card-header>
  <nb-card-body>
    <h5>{{ actionText }} {{ text }}</h5>
  </nb-card-body>
  <nb-card-footer class="dialog-footer">
    <button (click)="dismiss()" nbButton status="danger">{{ 'COMMON.CANCEL' | translate }}</button>
    <button (click)="remove()" nbButton status="primary">{{ 'COMMON.OK' | translate }}</button>
  </nb-card-footer>
</nb-card>
