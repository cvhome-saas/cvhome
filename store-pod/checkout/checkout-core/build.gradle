plugins {
    alias(libs.plugins.java.library.conventions)
}

dependencies {
    api project(':store-pod:commons:store-commons')
    api project(':store-pod:checkout:checkout-commons')
    // Neighbours are reached through their -external-api only; never a -core or -service.
    implementation project(':store-pod:merchant:merchant-external-api')
    implementation project(':store-pod:catalog:catalog-external-api')
    implementation project(':store-pod:inventory:inventory-external-api')
    implementation project(':store-pod:payment:payment-external-api')
    compileOnly libs.spring.data.jpa
    compileOnly libs.spring.boot.starter.autoconfigure
    compileOnly libs.hibernate.core
    compileOnly libs.jakarta.validation.api
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // The aggregate under test extends AbstractAggregateRoot, which is compileOnly for main.
    testImplementation libs.spring.data.jpa
    // Mockito mocks the JPA repositories, whose annotations reference jakarta.persistence at load time.
    testImplementation libs.jakarta.persistence.api
    testImplementation libs.spring.boot.starter.autoconfigure
}
