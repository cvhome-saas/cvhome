plugins {
	id 'com.asrevo.java-library-conventions'
	id("com.diffplug.spotless") version "6.25.0"
}

dependencies {
	api project(':store-pod:store-commons')
	compileOnly 'org.springframework.data:spring-data-jpa:3.4.5'
	compileOnly 'jakarta.validation:jakarta.validation-api:3.0.2'
	compileOnly 'com.fasterxml.jackson.core:jackson-annotations:2.18.3'
	compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
	compileOnly 'org.projectlombok:lombok:1.18.38'
	compileOnly 'org.hibernate.orm:hibernate-core:6.6.13.Final'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'
}
