plugins {
    alias(libs.plugins.java.library.conventions)
}

dependencies {
    // The unit tests build entities (SalesManagerEntity extends Spring Data's AbstractAggregateRoot) and read
    // JPA-annotated fields, so the interfaces production code only compiles against must resolve at test time.
    testImplementation libs.spring.data.commons
    testImplementation libs.spring.data.jpa
    testImplementation libs.jakarta.persistence.api
    testImplementation libs.hibernate.core
    api project(':store-pod:commons:store-commons')
    api project(':store-pod:merchant:merchant-external-api')
    api project(':store-pod:catalog:catalog-external-api')
    api project(':store-pod:inventory:inventory-external-api')
    api project(':store-pod:payment:payment-external-api')
    api project(':store-pod:checkout:checkout-commons')
    api project(':store-pod:commons:customer:customer-core')
    implementation project(':store-pod:commons:reference:reference-core')
    implementation libs.commons.beanutils
    compileOnly libs.spring.data.jpa
    compileOnly libs.jakarta.validation.api
    compileOnly libs.jackson.annotations
    compileOnly libs.apache.commons.lang3
    compileOnly libs.lombok
    compileOnly libs.hibernate.core
    annotationProcessor libs.lombok
}
