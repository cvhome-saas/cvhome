spring:
  config:
    import:
      - "classpath:fargate-config.yml"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          default-filters:
            - TokenRelay
            - PreserveHostHeader
            - AddResponseHeader=X-Frame-Options, SAMEORIGIN
          x-forwarded:
            host-append: false
            for-append: false
          globalcors:
            cors-configurations:
              '[/**]':
                          allowedOrigins: "*"
                          allowedMethods: "*"
                          allowedHeaders: "*"