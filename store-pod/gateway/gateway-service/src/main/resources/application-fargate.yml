spring:
  cloud:
    loadbalancer:
      eager-load:
        clients:
          - "store-pod-gateway"
          - "merchant"
          - "content"
          - "catalog"
          - "order"
          - "landing-ui"
          - "merchant-ui"
    ecs:
      discovery:
        namespace: "store-pod-1.cvhome.lcl"
        namespace-id: "ns-je7qri6wn7fbsrpn"
        enabled: true
        default-port: 8080
        service-ports:
          "core-auth": 8001
          "store-core-gateway": 8000
          "store-ui": 8010
          "welcome-ui": 8011
          "manager": 8020
          "subscription": 8021
          "store-pod-gateway": 8100
          "landing-ui": 8110
          "merchant-ui": 8111
          "merchant": 8120
          "content": 8121
          "catalog": 8122
          "order": 8123
    gateway:
      discovery:
        locator:
          enabled: true
      default-filters:
        - TokenRelay
        - PreserveHostHeader
        - AddResponseHeader=X-Frame-Options, SAMEORIGIN
      x-forwarded:
        host-append: false
        for-append: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
        