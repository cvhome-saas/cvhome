plugins {
    alias(libs.plugins.java.library.conventions)
    // Its entities are bytecode-enhanced in native builds: com.asrevo.java-common-conventions.
    alias(libs.plugins.hibernate.orm)
}

dependencies {
    api project(':store-pod:commons:store-commons')
    api project(':store-pod:inventory:inventory-commons')
    api project(':store-pod:checkout:checkout-external-api')
    compileOnly libs.spring.data.jpa
    compileOnly libs.hibernate.core
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // The entity under test extends AbstractAggregateRoot, which is compileOnly for main.
    testImplementation libs.spring.data.jpa
    // Mockito mocks the JPA repositories, whose annotations reference jakarta.persistence at load time.
    testImplementation libs.jakarta.persistence.api
}
