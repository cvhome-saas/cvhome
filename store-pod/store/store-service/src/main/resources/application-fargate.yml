spring:
  datasource:
    url: jdbc:postgresql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.database}
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  cloud:
    loadbalancer:
      eager-load:
        clients:
          - "store-pod-gateway"
          - "store"
          - "landing-ui"
    ecs:
      discovery:
        namespace: "store-pod.cvhome.lcl"
        namespace-id: "ns-je7qri6wn7fbsrpn"
        enabled: true
        default-port: 8080
        service-ports:
          "store": 6001
          "landing-ui": 6002
