spring:
  datasource:
    url: jdbc:postgresql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.database}
  cloud:
    loadbalancer:
      eager-load:
        clients:
          - "store-pod-gateway"
          - "store"
          - "landing-ui"
    ecs:
      discovery:
        namespace: "store-pod-1.cvhome.lcl"
        namespace-id: "ns-je7qri6wn7fbsrpn"
        enabled: true
        default-port: 8080
        service-ports:
          "store": 7101
          "landing-ui": 7102
