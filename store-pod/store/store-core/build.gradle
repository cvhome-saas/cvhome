plugins {
    id 'com.asrevo.java-library-conventions'
}

dependencies {
    api project(':store-pod:store:store-commons')
    compileOnly 'org.springframework:spring-web:6.1.10'
    compileOnly 'org.springframework.data:spring-data-commons:3.3.1'
    compileOnly 'org.springframework.data:spring-data-jpa:3.3.1'
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    compileOnly 'jakarta.validation:jakarta.validation-api:3.0.2'
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    compileOnly 'org.apache.commons:commons-lang3:3.14.0'
    compileOnly 'org.hibernate.orm:hibernate-core:6.5.2.Final'
    compileOnly 'org.hibernate.common:hibernate-commons-annotations:6.0.6.Final'
    implementation 'commons-validator:commons-validator:1.9.0'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
}
