plugins {
    alias(libs.plugins.java.library.conventions)
}

dependencies {
    api project(':store-pod:commons:store-commons')
    api project(':store-pod:content:content-commons')
    // api, not implementation: this module's service and facade signatures name cms-commons exception types,
    // so a consumer has to see them to catch them.
    api project(':store-pod:commons:store-modules:store-cms-commons')
    compileOnly libs.spring.data.jpa
    compileOnly libs.jakarta.validation.api
    compileOnly libs.lombok
    compileOnly libs.hibernate.core
    annotationProcessor libs.lombok
}
