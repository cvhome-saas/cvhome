spring:
  application:
    name: content
  config:
    import: "classpath:common-config.yml"
  security:
    oauth2:
      client:
        registration:
          s2s:
            provider: uaa
            client-id: store-pod-507f1f77@service.store-pod.internal
            client-secret: hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7
            authorization-grant-type: client_credentials
            scope: store_pod
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 250MB
  sql:
    init:
      schema-locations: classpath:init-sql/schema.sql
      data-locations: classpath:init-sql/data-common.sql, classpath:init-sql/data-sequences.sql
  jpa:
    properties:
      hibernate:
        default_schema: ${spring.application.name}
namastack:
  outbox:
    multicaster:
      enabled: true
    polling:
      fixed:
        interval: 2s
      batch-size: 10
    jpa:
      schema-initialization:
        enabled: false
      schema-name: ${spring.application.name}
cvhome:
  metrics:
    outbox:
      # Outbox gauges (cvhome_outbox_records, cvhome_outbox_oldest_pending_seconds) over this service's outbox table.
      enabled: true
      table: content.outbox_record
