<h2>ما ملفات تعريف الارتباط التي نستخدمها</h2><p>الملفات الضرورية تُبقيك مسجّل الدخول وتحفظ سلّتك. ملفات التحليلات — بموافقتك — تساعدنا على فهم استخدام المتجر. ملفات التسويق لا تُفعَّل إلا بموافقتك.</p>
<h2>خياراتك</h2><p>يمكنك تغيير موافقتك في أي وقت من رابط إعدادات ملفات تعريف الارتباط في أسفل الصفحة، ومسحها من متصفحك.</p>
