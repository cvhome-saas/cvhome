  docker:
    compose:
      file: ${spring.application.name}/compose.yml
  sql:
    init:
      mode: always
      schema-locations: classpath:init-sql/schema.sql
      data-locations: classpath:init-sql/data-common.sql
---
spring:
  application:
    name: merchant
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: merchant
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  forward-headers-strategy: NATIVE
  port: ${com.asrevo.cvhome.services.merchant.port}
info:
  app:
    name: ${spring.application.name}
management:
  observations:
    key-values:
      application: ${spring.application.name}