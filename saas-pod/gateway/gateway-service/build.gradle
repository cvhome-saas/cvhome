bootBuildImage {
    builder = "paketobuildpacks/builder:tiny"
    imageName = "${System.getenv("REGISTRY")}/saas-pod/saas-pod-gateway"
    tags = ["${System.getenv("REGISTRY")}/saas-pod/saas-pod-gateway:${project.version}", "${System.getenv("REGISTRY")}/saas-pod/saas-pod-gateway:latest"]
    docker {
        publishRegistry {
            url = System.getenv("REGISTRY")
            username = "AWS"
            password = System.getenv("ECR_TOKEN")
        }
    }
}

ext {
    set('springCloudVersion', "2023.0.0")
}
dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.5'
    implementation 'org.shredzone.acme4j:acme4j-utils:2.15'
    implementation 'com.google.guava:guava:31.1-jre'

    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'

    implementation project(':core:dcm:dcm-commons')
    implementation project(':commons:ecs-commons:fargate-task-info')
    implementation project(':commons:ecs-commons:ecs-service-discoveryclient')
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mockserver:1.19.6'
    testImplementation 'org.mock-server:mockserver-client-java:5.15.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}
