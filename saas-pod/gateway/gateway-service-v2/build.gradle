task "clean" {
    doLast {
    }
}

task "build" {
    doLast {
    }
}

tasks.register('bootBuildImage', BootBuildImageTask) {
    dependsOn('build')
}


abstract class BootBuildImageTask extends DefaultTask {
    private Boolean publishImage = false


    @Option(option = "publishImage", description = "Configures PublishImage.")
    void setPublishImage(Boolean publishImage) {
        this.publishImage = publishImage;
    }

    BootBuildImageTask() {
    }


    @TaskAction
    void bootBuildImage() {
        String image = "${System.getenv('REGISTRY')}/saas-pod/${project.name}"
        project.exec {
            workingDir '.'
            commandLine "docker", "build", "-t", "${image}","-t", "${System.getenv('REGISTRY')}/saas-pod/${project.name}:${project.version}", "-t", "${System.getenv('REGISTRY')}/saas-pod/${project.name}:latest", "."
        }
        if (publishImage) {
            project.exec {
                workingDir '.'
                commandLine "docker", "push", image, "--all-tags"
            }
        }
    }

}
