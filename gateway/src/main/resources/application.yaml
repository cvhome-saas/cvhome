spring:
  application:
    name: gateway
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/gatewaydb
    username: postgres
    password: password
  cloud:
    local:
      discovery:
        services:
          user:
            - url: "http://localhost:8081"
              metadata:
                service-name: user
                instance: user-1
          certificate-manager:
            - url: "http://localhost:8082"
              metadata:
                service-name: certificate-manager
                instance: certificate-manager-1
          ui:
            - url: "http://localhost:4200"
              metadata:
                service-name: ui
                instance: ui-1
    gateway:
      discovery:
        locator:
          enabled: true
      default-filters:
        - MapHostAsRequestParam=userId
      routes:
        - id: user
          uri: lb://user
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        - id: certificate-manager
          uri: lb://certificate-manager
          predicates:
            - Path=/certificate-manager/**
          filters:
            - StripPrefix=1
        - id: ui
          uri: lb://ui:4200
          predicates:
            - Host={domain}.{x},{sub}.{domain}.{x}
server:
  port: 8443
info:
  app:
    name: ${spring.application.name}
management:
  info:
    env:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: [ '*' ]
com:
  asrevo:
    cvhome:
      ssl:
        default-domain: "wl.asrevo.com"
        sub-domain-fallback: "*.wl.asrevo.com"
logging:
  level:
    org.springframework.web: debug