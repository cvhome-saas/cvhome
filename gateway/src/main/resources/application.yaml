spring:
  application:
    name: gateway
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/gatewaydb
    username: postgres
    password: password
  cloud:
    discovery:
      client:
        simple:
          instances:
            user:
              - uri: "http://localhost:8081"
                metadata:
                  service-name: user
                  instance: user-1
            certificate-manager:
              - uri: "http://localhost:8082"
                metadata:
                  service-name: certificate-manager
                  instance: certificate-manager-1
            auth:
              - uri: "http://localhost:9999"
                metadata:
                  service-name: auth
                  instance: auth-1
            ui:
              - uri: "http://localhost:4200"
                metadata:
                  service-name: ui
                  instance: ui-1
            profile:
              - uri: "http://localhost:4300"
                metadata:
                  service-name: profile
                  instance: profile-1
            gateway:
              - uri: "http://localhost:8080"
                metadata:
                  service-name: gateway
                  instance: gateway-1
    gateway:
      discovery:
        locator:
          enabled: true
      default-filters:
        - MapHostAsRequestParam=userId
        - TokenRelay
        - PreserveHostHeader
        - AddResponseHeader=X-Frame-Options, SAMEORIGIN
      routes:
        - id: user
          uri: lb://user
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        - id: certificate-manager
          uri: lb://certificate-manager
          predicates:
            - Path=/certificate-manager/**
          filters:
            - StripPrefix=1
        - id: auth
          uri: lb://auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: realms
          uri: lb://auth
          predicates:
            - Path=/realms/**
        - id: resources
          uri: lb://auth
          predicates:
            - Path=/resources/**
        - id: js
          uri: lb://auth
          predicates:
            - Path=/js/**
        - id: ui
          uri: lb://ui
          predicates:
            - FHost=gateway.com,www.gateway.com
        - id: profile
          uri: lb://profile
          predicates:
            - FHost={domain}.{x},{sub}.{domain}.{x}
  security:
    oauth2:
      client:
        registration:
          microservice:
            provider: keycloak
            client-id: microservice-app
            client-secret: r1nuVn4HefusLGwHIeRxbdOzdTZLEMvQ
            authorization-grant-type: password
          keycloak:
            client-id: web-app
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            redirect-uri: https://gateway.com:8443/login/oauth2/code/keycloak
            provider: keycloak
            client-secret: hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7
        provider:
          keycloak:
#            comment issuer-uri to skip validation
#            issuer-uri: https://gateway.com:8443/realms/cvhome
            jwk-set-uri: http://localhost:9999/realms/cvhome/protocol/openid-connect/certs
            authorization-uri: https://gateway.com:8443/realms/cvhome/protocol/openid-connect/auth
            token-uri: http://localhost:9999/realms/cvhome/protocol/openid-connect/token
#            need to trace why getting 401
#            user-info-uri: http://localhost:9999/realms/cvhome/protocol/openid-connect/userinfo
#            user-name-attribute: sub
server:
  port: 8443
info:
  app:
    name: ${spring.application.name}
management:
  info:
    env:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: [ '*' ]
com:
  asrevo:
    cvhome:
      ssl:
        default-domain: "gateway.com"
        sub-domain-fallback: "*.gateway.com"
logging:
  level:
    org.springframework.boot: debug
    org.springframework.web: debug
    org.springframework.security: debug
    reactor.netty.http: debug