plugins {
    id 'com.asrevo.java-application-conventions'
    id 'org.springframework.boot' version '3.2.0-M2'
    id 'io.spring.dependency-management' version '1.1.3'
//    id 'org.graalvm.buildtools.native' version '0.9.24'
    id 'jacoco'
}
group = 'com.asrevo.cvhome'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot {
    buildInfo()
}

bootBuildImage {
    builder = "paketobuildpacks/builder:tiny"
    imageName = "ghcr.io/ashraf-revo/${project.name}:${project.version}"
    docker {
        publishRegistry {
            url = "https://ghcr.io"
            username = "ashraf-revo"
            password = System.getenv("GHCR_TOKEN")
        }
    }
}

ext {
    set('springCloudVersion', "2023.0.0-M1")
}
dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.5'
    implementation 'org.shredzone.acme4j:acme4j-utils:2.15'
    implementation 'com.google.guava:guava:31.1-jre'

    implementation project(':commons')
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

test {
    finalizedBy jacocoTestReport // report is always generated after tests run
}
jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
}