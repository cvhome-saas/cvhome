pluginManagement {
    // Include 'plugins build' to define convention plugins.
    includeBuild('build-logic')
    repositories {
        maven { url 'https://repo.spring.io/milestone' }
        gradlePluginPortal()
    }
}

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'cvhome'
include(
        'commons:ecs-commons:fargate-task-info',
        'commons:ecs-commons:ecs-service-discoveryclient',
        'commons:cvhome-commons',
        'commons:s2sc-commons',

        'core:gateway:gateway-service',
        'core:auth',
        'core:dcm:dcm-commons',
        'core:dcm:dcm-events',
        'core:dcm:dcm-service',
        'core:router:router-commons',
        'core:router:router-events',
        'core:router:router-service',
        'core:welcome-ui',

        'store-pod:commons',
        'store-pod:gateway:gateway-service',
        'store-pod:store:store-commons',
        'store-pod:store:store-core',
        'store-pod:store:store-events',
        'store-pod:store:store-service',
        'store-pod:landing-ui:landing-ui-commons',
        'store-pod:landing-ui:landing-ui-events',
        'store-pod:landing-ui:landing-ui-service',

        'store-core:commons',
        'store-core:gateway:gateway-service',
        'store-core:manager:manager-commons',
        'store-core:manager:manager-events',
        'store-core:manager:manager-service',
        'store-core:wallet:wallet-commons',
        'store-core:wallet:wallet-events',
        'store-core:wallet:wallet-service',
        'store-core:store-ui',

        'saas-pod:gateway:gateway-service',
        'saas-pod:gateway:gateway-service-v2',

)
