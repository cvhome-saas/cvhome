spring:
  application:
    name: domain
  docker:
    compose:
      file: ${spring.application.name}/compose.yml
  sql:
    init:
      mode: always
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/userdb
    username: postgres
    password: password
  security:
    oauth2:
      client:
        registration:
          microservice:
            provider: keycloak
            client-id: microservice-app
            client-secret: r1nuVn4HefusLGwHIeRxbdOzdTZLEMvQ
            authorization-grant-type: password
        provider:
          keycloak:
            #            comment issuer-uri to skip validation
            #            issuer-uri: https://gateway.com:8443/realms/cvhome
            jwk-set-uri: http://localhost:9999/realms/cvhome/protocol/openid-connect/certs
            authorization-uri: http://localhost:9999/realms/cvhome/protocol/openid-connect/auth
            token-uri: http://localhost:9999/realms/cvhome/protocol/openid-connect/token
              #            need to trace why getting 401
              #            user-info-uri: http://localhost:9999/realms/cvhome/protocol/openid-connect/userinfo
              #            user-name-attribute: sub
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/realms/cvhome/protocol/openid-connect/certs
  cloud:
    discovery:
      client:
        simple:
          instances:
            domain:
              - uri: "http://localhost:8081"
                metadata:
                  service-name: domain
                  instance: domain-1
            certificate-manager:
              - uri: "http://localhost:8082"
                metadata:
                  service-name: certificate-manager
                  instance: certificate-manager-1
            auth:
              - uri: "http://localhost:9999"
                metadata:
                  service-name: auth
                  instance: auth-1
            ui:
              - uri: "http://localhost:4200"
                metadata:
                  service-name: ui
                  instance: ui-1
            profile:
              - uri: "http://localhost:4300"
                metadata:
                  service-name: profile
                  instance: profile-1
            gateway:
              - uri: "http://localhost:8080"
                metadata:
                  service-name: gateway
                  instance: gateway-1
server:
  forward-headers-strategy: FRAMEWORK
  port: 8081
info:
  app:
    name: ${spring.application.name}
management:
  info:
    env:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: [ '*' ]
logging:
  level:
    org.springframework.boot: debug
    org.springframework.web: debug
    org.springframework.security: debug