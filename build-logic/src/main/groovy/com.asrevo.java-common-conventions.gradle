plugins {
    // Apply the java Plugin to add support for Java.
    id 'java'
}

java {
    sourceCompatibility = '23'
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
}