/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'java'
    id 'checkstyle'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.spring.io/milestone' }
    mavenCentral()
    gradlePluginPortal()
}

checkstyle {
    toolVersion = "10.12.4"
    configDirectory = file("$rootDir/config/checkstyle")
}

tasks.named('checkstyleMain') {
    enabled = true
    reports {
        xml.outputLocation = rootProject.layout.buildDirectory.file("reports/checkstyle/${project.name}.xml")
        html.outputLocation = rootProject.layout.buildDirectory.file("reports/checkstyle/${project.name}.html")
    }
}

tasks.named('checkstyleTest') {
    enabled = true
    reports {
        xml.outputLocation = rootProject.layout.buildDirectory.file("reports/checkstyle/${project.name}.xml")
        html.outputLocation = rootProject.layout.buildDirectory.file("reports/checkstyle/${project.name}.html")
    }
}

dependencies {
}