/*
 * Base conventions for every Java module: toolchain, checkstyle and the unit-test contract.
 *
 * Unit tests live in src/test and are named *Test (or *ArchitectureTest). They never need Docker or a Spring
 * context. Integration tests are a separate source set — see com.asrevo.java-integration-test-conventions.
 */

plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.spring.io/milestone' }
    mavenCentral()
    gradlePluginPortal()
}

// Method parameter names in the bytecode, for every module. Spring Boot's plugin adds -parameters only to the module
// it is applied to — the services — while the JPA repositories live in the -core libraries. Spring Data needs the
// names to bind a query method's parameters, and its ahead-of-time repository generation (a GraalVM native build)
// refuses a method without them: "MethodParameter.getParameterName() must not be null".
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

/*
 * Hibernate bytecode enhancement — lazy loading only, and only in a native build (-Pnative, or a native* task such as
 * nativeCompile). A native image cannot generate Hibernate's proxy subclasses at run time ("Generation of
 * HibernateProxy instances at runtime is not allowed when the configured BytecodeProvider is 'none'"), so there a
 * lazy to-one association has to be an enhanced entity: an uninitialised instance of the entity class itself. The JVM
 * generates its proxies and never needed it, and enhanced bytecode is not reproducible across machines (the same
 * commit gave the same entity three different class checksums on two CI runners and a laptop), which CI's coverage
 * job cannot survive: it recompiles, then matches JaCoCo's data to the classes by checksum. So a JVM build compiles
 * plain entities, exactly as before native existed, and a native build enhances every module that applies the
 * Hibernate plugin (the ones with lazy to-one associations; the services that apply it hold no entities). Dirty
 * tracking and association management stay off. See .agents/plans/graalvm-native-images.md.
 */
boolean nativeBuild = providers.gradleProperty('native').map { it != 'false' }.getOrElse(false) ||
        gradle.startParameter.taskNames.any { it.tokenize(':').last().startsWith('native') }
pluginManager.withPlugin('org.hibernate.orm') {
    if (nativeBuild) {
        hibernate {
            enhancement {
                enableLazyInitialization = true
                enableDirtyTracking = false
                enableAssociationManagement = false
            }
        }
    }
}

checkstyle {
    toolVersion = "10.12.4"
    configDirectory = file("$rootDir/config/checkstyle")
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

def checkstyleReport = { String sourceSetName ->
    tasks.named("checkstyle${sourceSetName.capitalize()}") {
        enabled = true
        maxWarnings = 0
        reports {
            xml.outputLocation = rootProject.layout.buildDirectory.file("reports/checkstyle/${project.name}-${sourceSetName}.xml")
            html.outputLocation = rootProject.layout.buildDirectory.file("reports/checkstyle/${project.name}-${sourceSetName}.html")
        }
    }
}
checkstyleReport('main')
checkstyleReport('test')
ext.checkstyleReport = checkstyleReport

dependencies {
    // Library modules carry no Boot dependency management, so the versionless catalog aliases only resolve
    // because the BOM is imported for the test classpath here.
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot.get()}")
    testImplementation libs.bundles.test.unit
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
    include '**/*Test.class'
    exclude '**/*IntegrationTest.class'
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

// processResources is a Copy, and a Copy never removes what it copied before: delete a file under src/main/resources
// and its twin under build/resources/main stays until `clean`. That is harmless for most resources and fatal for
// the SQL seeds, because the test-stores profile runs every file matching init-sql/stores/*/*.sql — so a seed
// retired from src/ (the SECTION rows #309 replaced with layout documents) kept executing from build/ and failed
// the content service on start against the very check constraint the same PR had narrowed. Sync semantics
// instead: when the task runs at all, it starts from an empty destination. An up-to-date task still skips.
tasks.withType(ProcessResources).configureEach {
    doFirst {
        delete(destinationDir)
    }
}

// Coverage is gated per domain by the root com.asrevo.jacoco-aggregate-conventions plugin (domainCoverageMinimum in
// the root build.gradle); modules carry no gate of their own.

// The suffix is the contract: a misplaced test silently never runs, so fail loudly instead.
tasks.register('verifyTestNaming') {
    group = 'verification'
    description = 'Fails when a test class lives in the wrong source set for its suffix.'
    def unitDirs = files(sourceSets.test.allJava.srcDirs)
    inputs.files(unitDirs).skipWhenEmpty()
    doLast {
        def offenders = []
        unitDirs.each { dir ->
            if (dir.exists()) {
                dir.eachFileRecurse { f ->
                    if (f.name.endsWith('.java') && f.text.contains('@Test')) {
                        if (f.name.endsWith('IntegrationTest.java')) {
                            offenders << "${f} — *IntegrationTest belongs in src/integrationTest"
                        } else if (!f.name.endsWith('Test.java')) {
                            offenders << "${f} — unit test classes must end in Test"
                        }
                    }
                }
            }
        }
        if (offenders) {
            throw new GradleException("Test naming violations:\n  " + offenders.join("\n  "))
        }
    }
}

// No bean exists or not because of configuration. The bean graph is the same in every deployment: @Profile and
// @ConditionalOnProperty decide by whatever environment the context starts in, and anything that fixes the graph ahead
// of time (Spring AOT, a GraalVM native image) decides it once, at build, for Fargate, every flavour and the
// load-testing stack alike — Fargate's AWS_EXECUTION_ENV, the task's Cloud Map namespace, the test-stores profile, an
// operator's one-shot seed switch. A switch is read when the code runs instead (a bean that returns early, a client
// that knows no services when off). Class- and bean-presence conditions (@ConditionalOnClass,
// @ConditionalOnMissingBean, @ConditionalOnWebApplication) are the same in every deployment and stay.
tasks.register('verifyNoConfigurationSwitchedBeans') {
    group = 'verification'
    description = 'Fails when main code makes a bean depend on a profile or a property.'
    def mainDirs = files(sourceSets.main.allJava.srcDirs)
    inputs.files(mainDirs).skipWhenEmpty()
    doLast {
        def forbidden = ~/@(Profile|ConditionalOnProperty|ConditionalOnBooleanProperty|ConditionalOnExpression)\b/
        def offenders = []
        mainDirs.each { dir ->
            if (dir.exists()) {
                dir.eachFileRecurse { f ->
                    if (f.name.endsWith('.java')) {
                        f.readLines().eachWithIndex { line, i ->
                            String code = line.trim()
                            if (!code.startsWith('*') && !code.startsWith('//') && code =~ forbidden) {
                                offenders << "${f}:${i + 1}: ${code}"
                            }
                        }
                    }
                }
            }
        }
        if (offenders) {
            throw new GradleException("A bean may not depend on a profile or a property — ahead-of-time processing "
                    + "decides it at build time, for every deployment. Read the switch at run time instead:\n  "
                    + offenders.join("\n  "))
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyTestNaming'
    dependsOn 'verifyNoConfigurationSwitchedBeans'
}
