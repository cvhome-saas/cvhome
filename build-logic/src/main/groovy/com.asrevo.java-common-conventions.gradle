plugins {
    id 'java'
    id 'io.spring.javaformat'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.spring.io/milestone' }
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
}