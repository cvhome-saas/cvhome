plugins {
    id 'com.asrevo.docker-conventions'
    id 'com.github.node-gradle.node'
}
node {
    version = '24.21.0'
    npmVersion = '11.6.1'
    download = true
    /*
     * `npm ci`, not `npm install`: install exactly what the committed package-lock.json says and fail if it
     * disagrees with package.json. With `install` every machine resolved its own tree, so a stale local lock
     * (or none) picked mismatched @angular/* patches and broke the build with ERESOLVE. Change a dependency
     * with `npm install <pkg>` and commit the lock it rewrites.
     */
    npmInstallCommand = 'ci'
}

tasks.named('build') {
    dependsOn('npm_run_build')
}

tasks.register('bootRun') {
    dependsOn('npm_run_dev')
    group = 'application'
    description = 'Runs the UI application in development mode.'
}

tasks.named('clean') {
    delete('dist')
}


