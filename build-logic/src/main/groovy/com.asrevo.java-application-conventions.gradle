plugins {
    id 'com.asrevo.java-common-conventions'

    id 'application'
    id 'jacoco'
}
dependencies {

}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform() {
        includeTags 'integration-test'
    }
}

tasks.register('unitTest', Test) {
    useJUnitPlatform() {
        includeTags 'unit-test'
    }
}

test {
    finalizedBy jacocoTestReport // report is always generated after tests run
}

//@TODO i think we have issue here it trigger all tests
integrationTest {
    finalizedBy jacocoTestReport // report is always generated after tests run
}
unitTest {
    finalizedBy jacocoTestReport // report is always generated after tests run
}
jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
}


static List<String> createImageTags(String repo, String version) {
    return [createImageName(repo, "latest")]
}
static String createImageName(String repo, String version) {
    String registry = System.getenv("REGISTRY")
    return registry ? "${registry}/${repo}:${version}" : "${repo}:${version}"
}

ext {
    createImageName = this.&createImageName
    createImageTags = this.&createImageTags
}