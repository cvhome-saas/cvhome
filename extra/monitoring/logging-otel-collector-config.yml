receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch/traces:
    send_batch_size: 40
    send_batch_max_size: 60
    timeout: 1s

  batch/metrics:
    send_batch_size: 40
    send_batch_max_size: 60
    timeout: 1s

  batch/logs:
    send_batch_size: 40
    send_batch_max_size: 60
    timeout: 1s

exporters:
  debug:
    verbosity: normal
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    compression: gzip

  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ batch/traces ]
      exporters: [ otlp/tempo ]

    metrics:
      receivers: [ otlp ]
      processors: [ batch/metrics ]
      exporters: [ prometheus ]

    logs:
      receivers: [ otlp ]
      processors: [batch/logs ]
      exporters: [ otlphttp/loki ]