spring:
  security:
    oauth2:
      client:
        registration:
          microservice:
            provider: keycloak
            client-id: microservice-app
            client-secret: r1nuVn4HefusLGwHIeRxbdOzdTZLEMvQ
            authorization-grant-type: password
          keycloak:
            client-id: web-app
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            provider: keycloak
            client-secret: hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7
        provider:
          keycloak:
            jwk-set-uri: ${com.asrevo.cvhome.services.auth.schema}://${com.asrevo.cvhome.services.auth.domain}:${com.asrevo.cvhome.services.auth.port}/realms/cvhome/protocol/openid-connect/certs
            authorization-uri: ${com.asrevo.cvhome.services.auth.schema}://${com.asrevo.cvhome.services.auth.domain}:${com.asrevo.cvhome.services.auth.port}/realms/cvhome/protocol/openid-connect/auth
            token-uri: ${com.asrevo.cvhome.services.auth.schema}://${com.asrevo.cvhome.services.auth.domain}:${com.asrevo.cvhome.services.auth.port}/realms/cvhome/protocol/openid-connect/token
  cloud:
    loadbalancer:
      eager-load:
        clients:
          - "gateway"
          - "domain-certificate-manager"
          - "auth"
          - "welcome-ui"
          - "admin-ui"
    ecs:
      discovery:
        namespace: "cvhome.lcl"
        namespace-id: "ns-je7qri6wn7fbsrpn"
        enabled: true
        default-port: 8080
        service-ports:
          "domain-certificate-manager": 8082
          "auth": 9999
          "welcome-ui": 4400
          "admin-ui": 4200
    gateway:
      discovery:
        locator:
          enabled: true
      default-filters:
        - TokenRelay
        - PreserveHostHeader
        - AddResponseHeader=X-Frame-Options, SAMEORIGIN
      routes:
        - id: domain-certificate-manager
          uri: lb://domain-certificate-manager
          predicates:
            - Path=/domain-certificate-manager/**
          filters:
            - StripPrefix=1
        - id: auth
          uri: lb://auth
          predicates:
            - FHost=${com.asrevo.cvhome.services.auth.domain}
        - id: realms
          uri: lb://auth
          predicates:
            - Path=/realms/**
          filters:
            - SetRequestHostHeader=${com.asrevo.cvhome.services.auth.domain}:${com.asrevo.cvhome.services.core-gateway.port}
        - id: resources
          uri: lb://auth
          predicates:
            - Path=/resources/**
        - id: js
          uri: lb://auth
          predicates:
            - Path=/js/**
        - id: welcome-ui
          uri: lb://welcome-ui
          predicates:
            - FHost=www.${com.asrevo.cvhome.services.core-gateway.domain},${com.asrevo.cvhome.services.core-gateway.domain}
        - id: admin-ui
          uri: lb://admin-ui
          predicates:
            - FHost=admin.${com.asrevo.cvhome.services.core-gateway.domain}
