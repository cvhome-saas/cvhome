com:
  asrevo:
    cvhome:
      services:
        core-gateway:
          name: core-gateway
          domain: "gateway.com"
          port: 8080
          schema: http
          namespace: core.cvhome.lcl
        saas-gateway:
          name: saas-gateway
          domain: "gateway.click"
          port: 8443
          schema: https
          namespace: saas.cvhome.lcl
        store-gateway:
          name: store-gateway
          domain: "gateway.me"
          port: 8085
          schema: http
          namespace: store.cvhome.lcl
        auth:
          name: auth
          domain: "auth.gateway.com"
          port: 9999
          schema: http
          namespace: core.cvhome.lcl
    auto-order-domains:
      domains:
        - domain: "cvhome.click"
      default-domain: "cvhome.click"
    dcm:
      challenge-config:
        acm-file-provider: table
        acm-table-config:
          directory: "nothing"
        dns-installer-config:
          providers:
            - route53
        http-installer-config:
          installer-file-provider: table
          installer-table-config:
            directory: "nothing"
        tls-alpn01-installer-config:
          installer-file-provider: table
          installer-table-config:
            directory: "nothing"
spring:
  application:
    name: domain-certificate-manager
  docker:
    compose:
      file: ${spring.application.name}/compose.yml
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${com.asrevo.cvhome.services.auth.schema}://${com.asrevo.cvhome.services.auth.domain}:${com.asrevo.cvhome.services.auth.port}/realms/cvhome/protocol/openid-connect/certs
springdoc:
  show-actuator: true
  api-docs:
    path: /api-docs
server:
  forward-headers-strategy: FRAMEWORK
  port: 8082
info:
  app:
    name: ${spring.application.name}
management:
  info:
    env:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: [ '*' ]
  observations:
    key-values:
      application: ${spring.application.name}
logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: debug
    org.springframework.boot: debug
    org.springframework.web: debug
    org.springframework.security: debug
    reactor.netty.http: debug
org:
  jobrunr:
    background-job-server:
      enabled: true
