spring:
  application:
    name: domain-certificate-manager
  docker:
    compose:
      file: ${spring.application.name}/compose.yml
  sql:
    init:
      mode: always
server:
  forward-headers-strategy: FRAMEWORK
  port: 8082
info:
  app:
    name: ${spring.application.name}
management:
  info:
    env:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: [ '*' ]
  observations:
    key-values:
      application: ${spring.application.name}
logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: debug
    org.springframework.boot: debug
    org.springframework.web: debug
    org.springframework.security: debug
    reactor.netty.http: debug
org:
  jobrunr:
    background-job-server:
      enabled: true
com:
  asrevo:
    auto-order-domains:
      domains:
        - domain: "cvhome.click"
      default-domain: "cvhome.click"
    dcm:
      challenge-config:
        acm-file-provider: table
        acm-table-config:
          directory: "nothing"
        dns-installer-config:
          providers:
            - route53
        http-installer-config:
          installer-file-provider: table
          installer-table-config:
            directory: "nothing"
        tls-alpn01-installer-config:
          installer-file-provider: table
          installer-table-config:
            directory: "nothing"
