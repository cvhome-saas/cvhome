plugins {
    alias(libs.plugins.java.library.conventions)
}

dependencies {
    api project(':store-commons:commons')
    api project(':store-commons:errors')
    compileOnly libs.jackson.databind
    compileOnly libs.spring.data.relational
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // Jackson is compileOnly above because a consuming service brings its own; the filter DTOs' binding behaviour —
    // which fields may be omitted from a request body — is only assertable by actually reading JSON.
    testImplementation libs.jackson.databind
}
