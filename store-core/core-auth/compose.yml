version: '3'
services:
  postgres:
    image: postgres:15-alpine
    network_mode: host
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
  mailcatcher:
    image: dockage/mailcatcher:0.9
    network_mode: host
    ports:
      - "1080:1080"
      - "1025:1025"
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    network_mode: host
    environment:
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_PORT: 8001
      KC_HTTP_MANAGEMENT_PORT: 9998

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:5432/kc
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password

      KEYCLOAK_ADMIN: sys-admin@mail.com
      KEYCLOAK_ADMIN_PASSWORD: admin

      COMMUNICATION_SERVICE_ENDPOINT: http://localhost:8000/communication

    command: --verbose start  --hostname-strict=false --import-realm --health-enabled=true
    #    command:  --verbose start --log-level=TRACE --hostname-strict=false --hostname-path=/auth --import-realm  --debug
    #    command:  --verbose start  --hostname-strict=false --import-realm
    volumes:
      - ./keycloak/imports:/opt/keycloak/data/import
      - ./keycloak/providers:/opt/keycloak/providers
      - ./keycloak/themes/json-mail-theme:/opt/keycloak/themes/json-mail-theme
      - ./keycloak/themes/cvhome:/opt/keycloak/themes/cvhome

    ports:
      - "8001:8001"
      - "8787:8787"
      - "9000:9000"
      - "9998:9998"
    depends_on:
      - postgres
      - mailcatcher