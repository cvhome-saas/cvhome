plugins {
	id 'com.asrevo.java-common-conventions'
	alias(libs.plugins.spring.javaformat)
}

repositories {
	mavenLocal()
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
	compileOnly 'org.keycloak:keycloak-core:26.1.3'
	compileOnly 'org.keycloak:keycloak-server-spi:26.1.3'
	compileOnly 'org.keycloak:keycloak-server-spi-private:26.1.3'
	compileOnly 'org.keycloak:keycloak-services:26.1.3'
	compileOnly 'org.keycloak:keycloak-saml-core-public:26.1.3'
	compileOnly 'org.projectlombok:lombok:1.18.38'

	annotationProcessor 'org.projectlombok:lombok:1.18.38'

	testImplementation platform('org.junit:junit-bom:5.10.0')
	testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.register('fatJar', Jar) {
	group = 'build'
	description = 'Assembles a fat jar including dependencies'

	archiveClassifier.set('all')
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	manifest {
		attributes 'Main-Class': 'com.asrevo.cvhome.kc.Main'
	}

	from(sourceSets.main.output)
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}

	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST'
}

tasks.test {
	useJUnitPlatform()
}

test {
	useJUnitPlatform()
}
