<div class="row">
  <div class="col-md-12">
    <nb-card class="inline-form-card">
      <nb-card-header>STORE MANAGER</nb-card-header>
      <nb-card-body>

        <form (ngSubmit)="onSubmit()" [formGroup]="storeForm">
          <div class="form-group row">
            <label for="inputName" class="label col-sm-3 col-form-label">Name</label>
            <div class="col-sm-9">
              <input type="text" formControlName="name" nbInput fullWidth id="inputName" placeholder="Name">
              <div class="help-block">
                <div
                  *ngIf="storeForm.controls['name'].invalid && (storeForm.controls['name'].dirty || storeForm.controls['name'].touched)"
                  class="text-danger">
                  <div *ngIf="storeForm.controls['name'].errors?.['required']">
                    Name is required.
                  </div>
                  <div *ngIf="storeForm.controls['name'].errors?.['minlength']">
                    Name is minLength.
                  </div>
                  <div *ngIf="storeForm.controls['name'].errors?.['pattern']">
                    Name is pattern.
                  </div>
                </div>
              </div>

            </div>

          </div>
          <div class="form-group row">
            <label for="inputEmail" class="label col-sm-3 col-form-label">Email</label>
            <div class="col-sm-9">
              <input formControlName="email" type="email" nbInput fullWidth id="inputEmail" placeholder="Email">
              <div class="help-block">
                <div
                  *ngIf="storeForm.controls['email'].invalid && (storeForm.controls['email'].dirty || storeForm.controls['email'].touched)"
                  class="text-danger">
                  <div *ngIf="storeForm.controls['email'].errors?.['required']">
                    Email is required.
                  </div>
                  <div *ngIf="storeForm.controls['email'].errors?.['email']">
                    Email not valid.
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-3 label">country</label>
            <div class="col-sm-9">
              <nb-select  formControlName="country">
                <nb-option *ngFor="let c of countries" [value]="c">{{ c }}</nb-option>
              </nb-select>
              <div class="help-block">
                <div
                  *ngIf="storeForm.controls['country'].invalid && (storeForm.controls['country'].dirty || storeForm.controls['country'].touched)"
                  class="text-danger">
                  <div *ngIf="storeForm.controls['country'].errors?.['required']">
                    Country is required.
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="form-group row">
            <div class="offset-sm-3 col-sm-9">
              <button type="submit" nbButton status="primary">Save</button>
            </div>
          </div>
        </form>
        <div *ngIf="stores.content">
          <table class="table text-nowrap mb-0 align-middle">
            <thead class="text-dark fs-4">
            <tr>
              <th class="border-bottom-0">
                <h6 class="fw-semibold mb-0">Store Name</h6>
              </th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let d of stores.content">
              <td class="border-bottom-0">
                <h6 class="fw-semibold mb-1">
                  <a [routerLink]="d.id?.id">{{ d.name }}</a>
                </h6>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </nb-card-body>
    </nb-card>
  </div>
</div>
