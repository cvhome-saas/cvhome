<div [nbSpinner]="loading" nbSpinnerSize="large" nbSpinnerStatus="primary">
  <div class="inner_pages inventory_create_page tab-padding" *ngIf="!loading">
    <nb-card class="mainBody">
      <nb-card-body>
        <div class="form-group row">
          <label for="inputCategory" class="label col-sm-2 col-form-label">
            {{'COMPONENTS.PRODUCT_TO_CATEGORY_ADD' |translate}}
          </label>
          <div class="col-sm-8">
            <nb-select id="inputCategory" fullWidth status="info" (selectedChange)="change($event)" multiple
                       placeholder="'...'"
                       [(selected)]="selectedItems">
              <nb-option *ngFor="let o of categories" [value]="o.id">{{ o.name }}</nb-option>
            </nb-select>
          </div>
        </div>
      </nb-card-body>
    </nb-card>

  </div>
</div>
