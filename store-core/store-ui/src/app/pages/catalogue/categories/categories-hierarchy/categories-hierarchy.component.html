<nb-card class="page-card inner_pages">
  <nb-card-body [nbSpinner]="loader" nbSpinnerSize="large" nbSpinnerStatus="primary" class="category_hierarcy">
    <div class="inner_pages_legacy">
      <nb-card-header class="main_header">
        <h1 class="page_title">{{ 'COMPONENTS.CATEGORIES_HIERARCHY' | translate }}</h1>
        <div class="content_spacing_empty">
          <p>
            {{ 'CATEGORY_HIERARCHY.DETAILS' | translate }}
          </p>
        </div>
      </nb-card-header>
      <form class="form-inline filter_section">
        <div class="filter_left_section">
        </div>
        <div class="filter_right_section">
          <ngx-store-autocomplete (onStore)="onSelectStore($event)"></ngx-store-autocomplete>
        </div>
      </form>
      <div *ngIf="nodes.length !== 0">
        <tree-root #tree [nodes]="nodes" [options]="options" (moveNode)="onMoveNode($event)">
          <ng-template #treeNodeTemplate let-node let-index="index">
            <div>{{ node.data.name }}</div>
          </ng-template>
        </tree-root>
      </div>
    </div>
  </nb-card-body>
</nb-card>
