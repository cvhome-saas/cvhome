<div class="inner_pages option_create_page">
  <form [formGroup]='form' class="optionDetailsForm">
    <nb-card-header class="main_header">
      <h1 class="page_title">{{ 'COMPONENTS.OPTIONS' | translate }}</h1>
      <div class="content_spacing">
        <button (click)="goToBack()" class="cancel_button" nbButton type="button">{{
            'ORDER_FORM.CANCEL'
              | translate
          }}
        </button>
      </div>
      <div class="content_spacing">
        <button (click)="save()" *ngIf="!loader" [disabled]="!form.valid" class="success_button" nbButton
                type="submit">{{
            'COMMON.SAVE'
              |
              translate
          }}
        </button>
      </div>
    </nb-card-header>

    <div *ngIf="!loader" [nbSpinner]="loadingInfo" nbSpinnerSize="large" nbSpinnerStatus="primary">
      <nb-card class="nb-card inline-form-card">
        <nb-card-body class="nb-card-body">
          <div class="form-group">
            <label class="col-sm-10 col-form-label inputLabel" for="code">{{ 'COMMON.CODE' | translate }} *</label>
            <div class="col-sm-12">
              <input (change)="checkCode($event)" [readOnly]="option.id" class="form-control inputText" formControlName='code'
                     id="code" placeholder="{{ 'COMMON.CODE' | translate}}" required
                     type="text">
              <div *ngIf="(code.dirty || code.touched) && code.invalid && code">
                <span *ngIf="code.errors.required" class="err-message">
                  {{ 'COMMON.CODE_REQUIRED' | translate }}
                </span>
                <span *ngIf="code.errors.pattern" class="err-message">
                  {{ 'COMMON.ALPHA_DECIMAL_RULE' | translate }}
                </span>
              </div>
              <span *ngIf="!isCodeUnique" class="err-message">
                {{ 'COMMON.CODE_EXISTS' | translate }}
              </span>
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-10 col-form-label inputLabel" for="code">{{ 'COMMON.LANGUAGE' | translate }} *</label>
            <div class="col-sm-12">
              <nb-select *ngIf="languages.length" class="fullWidth" formControlName='selectedLanguage'
                         outline placeholder="{{ 'COMMON.LANGUAGE' | translate }}" shape="rectangle">
                <nb-option *ngFor="let language of languages" [value]="language.code">{{
                    ('LANG.' + language.code) |
                      translate
                  }}
                </nb-option>
              </nb-select>
            </div>
          </div>
          <div *ngIf="!loader" formArrayName='descriptions'>
            <div *ngFor="let descr of descriptions.controls; let j=index">
              <div *ngIf="descr.value.language === selectedLanguage.value">
                <div [formGroupName]="j">
                  <div class="form-group">
                    <label class="col-sm-10 col-form-label inputLabel" for="name">{{
                        'DESCRIPTION_FORM.NAME' |
                          translate
                      }}
                      *</label>
                    <div class="col-sm-12">
                      <input class="form-control inputText" formControlName='name' id="name" placeholder="{{ 'DESCRIPTION_FORM.NAME' | translate }}"
                             required type="text">
                      <span *ngIf="(descr.get('name').dirty || descr.get('name').touched) && descr.get('name').invalid
                                    && descr.get('name').errors.required" class="err-message">
                        {{ 'DESCRIPTION_FORM.NAME_REQUIRED' | translate }}
                      </span>
                    </div>
                  </div>

                </div>


              </div>
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-10 col-form-label inputLabel" for="type">{{ 'COMMON.TYPE' | translate }} *</label>
            <div class="col-sm-12">
              <nb-select *ngIf="types.length" class="fullWidth" formControlName='type'
                         id="type" outline placeholder="{{ 'COMMON.TYPE' | translate}}" required shape="rectangle">
                <nb-option *ngFor="let type of types" [value]="type">{{ 'COMMON.' + type | translate }}</nb-option>
              </nb-select>
            </div>
          </div>

          <!-- <div class="form-group">
            <label class="col-sm-10 col-form-label inputLabel">{{ 'COMMON.LANGUAGE' | translate }} *</label>
            <div class="col-sm-12">
              <nb-select *ngIf="languages.length" placeholder="{{ 'COMMON.LANGUAGE' | translate }}" outline shape="rectangle"
                formControlName='selectedLanguage' class="fullWidth">
                <nb-option *ngFor="let language of languages" [value]="language.code">{{ language.code }}</nb-option>
              </nb-select>
            </div>
          </div> -->


        </nb-card-body>
      </nb-card>


      <!-- </div> -->
    </div>
  </form>
</div>
