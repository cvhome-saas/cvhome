<nb-card status="basic" accent="info">
  <nb-card-header>
    <div class="row">
      <h1 class="page_title">{{ 'COMPONENTS.STATISTICS' | translate }}</h1>
    </div>
    <div class="row">
      <div class="col">
      </div>
      <div class="col col-lg-2">
        <input nbInput fullWidth [nbDatepicker]="fromDatePicker" [formControl]="fromDateControl" [readOnly]="true"
               class="form-control has-person-icon inputText" placeholder="Form Picker">
        <nb-datepicker #fromDatePicker (dateChange)="onFromDateChanged($event)"
                       [max]="fromMaxDates"/>
      </div>
      <div class="col col-lg-2">
        <input nbInput fullWidth [nbDatepicker]="toDatePicker" [formControl]="toDateControl" [readOnly]="true"
               class="form-control has-person-icon inputText" placeholder="To Picker">
        <nb-datepicker #toDatePicker (dateChange)="onToDateChanged($event)" [max]="toMaxDates"/>
      </div>
    </div>
  </nb-card-header>

  <nb-card-body [nbSpinner]="loader" nbSpinnerSize="large" nbSpinnerStatus="primary">
    <div class="row">
      <div class="col-lg-12">
        <nb-card status="control" accent="info">
          <nb-card-header>{{ 'STATISTICS.ORDER_STATUS' | translate }}</nb-card-header>
          <nb-card-body>
            <ngx-orders-statistic [paramsEmitter]="paramsEmitter"></ngx-orders-statistic>
          </nb-card-body>
        </nb-card>
      </div>
      <div class="col-lg-6">
        <nb-card status="control" accent="info">
          <nb-card-header>{{ 'STATISTICS.CUSTOMERS_COUNTRIES_FROM' | translate }}</nb-card-header>
          <nb-card-body>
            <ngx-customer-countries-statistic [paramsEmitter]="paramsEmitter"></ngx-customer-countries-statistic>
          </nb-card-body>
        </nb-card>
      </div>
      <div class="col-lg-6">
        <nb-card status="control" accent="info">
          <nb-card-header>{{ 'STATISTICS.TOP_SELLING_PRODUCTS' | translate }}</nb-card-header>
          <nb-card-body>
            <ngx-products-statistic [paramsEmitter]="paramsEmitter"></ngx-products-statistic>
          </nb-card-body>
        </nb-card>
      </div>
    </div>
  </nb-card-body>
</nb-card>
