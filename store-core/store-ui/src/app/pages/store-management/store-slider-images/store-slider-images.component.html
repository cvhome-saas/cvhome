<nb-card status="basic" accent="info">
  <nb-card-header>
    <div class="row">
      <h1 class="page_title">{{ 'STORE.STORE_SLIDER_IMAGES' | translate }}</h1>
    </div>
    <div class="row">
      <div class="col">
      </div>
      <div class="col col-lg-2">
        <nb-select fullWidth [(selected)]="selectedItem" outline shape="rectangle">
          <nb-option (click)="route(item.link)" *ngFor="let item of sidemenuLinks" [value]="item.id">{{ item.title }}
          </nb-option>
        </nb-select>
      </div>
      <div class="col col-lg-2">
        <button nbButton status="success" (click)="save()"
                type="submit">
          {{ 'COMMON.SAVE'  | translate }}
        </button>

      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <div class="mb-4" *ngIf="sliderImages.length <8">
      <h4 class="mb-3">{{ 'STORE.ADD_NEW_SLIDER_IMAGE' | translate }}</h4>
      <div (click)='newImageInput.click()' (dragover)="allowDrop($event)" (drop)="drop($event)" class="wrapper image-drop-zone">
        <div #newImageDrop id="newImageDrop" class="position-relative">
          <img *ngIf="newImageData" [src]="newImageData" class="img-fluid rounded" style="max-height: 250px"/>
          <div *ngIf="!newImageData" class="text-center py-5">
            <i class="fas fa-cloud-upload-alt fa-3x text-muted"></i>
            <div class="uploadingPhrase mt-3">{{ 'STORE_BRANDING.DROP_FILE' | translate }}</div>
          </div>
        </div>
      </div>
      <input nbInput fullWidth #newImageInput (change)='newImageChange($event)' id="newImageInput" required
             type="file" accept="image/*">
      <div class="d-flex justify-content-center mt-3">
        <button nbButton status="primary" class="me-2" (click)="saveNewImage(newImageInput)" [disabled]="!newImageData">
          <i class="fas fa-save me-2"></i>
          {{ 'COMMON.SAVE_NEW_IMAGE' | translate }}
        </button>
        <button nbButton status="danger" (click)="resetNewImage(newImageInput)" [disabled]="!newImageData">
          <i class="fas fa-undo me-2"></i>
          {{ 'COMMON.RESET' | translate }}
        </button>
      </div>
    </div>

    <div class="row g-4">
      <div *ngFor="let image of sliderImages; index as i" class="col-12 col-md-3">
        <div class="image-container p-3 border rounded">
          <div class="wrapper image-drop-zone mb-2">
            <div #imageDrop id="imageDrop">
              <img [src]="image.url" class="img-fluid rounded" style="max-height: 250px"/>
            </div>
          </div>

          <div class="d-flex justify-content-center gap-2 mt-2">
            <button nbButton status="primary" size="tiny" (click)="moveLeft(i)" [disabled]="i==0">
              <i class="fas fa-arrow-left"></i>
            </button>
            <button nbButton status="primary" size="tiny" (click)="moveRight(i)" [disabled]="i==sliderImages.length-1">
              <i class="fas fa-arrow-right"></i>
            </button>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-2">
            <span class="badge bg-primary">Priority: {{ i }}</span>
            <div class="btn-group gap-2">
              <button nbButton status="danger" size="small" (click)="deleteImage(i)">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </nb-card-body>
</nb-card>
