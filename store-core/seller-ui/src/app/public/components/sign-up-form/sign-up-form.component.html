<div class="contact-box bg-white text-center rounded p-1 pr-sm-5 pl-sm-5 pb-sm-5 mt-4 mt-lg-0 shadow-lg">
  <form (submit)="signUp()" [formGroup]="userForm" id="contact-form">
    <div class="contact-top pb-sm-3 pt-sm-3">
      <h3 class="contact-title">{{ title }}</h3>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="form-group" formGroupName="user">
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fas fa-user-alt"></i></span>
            </div>
            <input class="form-control" formControlName="firstName" name="firstName" placeholder="First Name"
                   required="required"
                   type="text">
          </div>
        </div>
        <div class="form-group" formGroupName="user">
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fas fa-user-alt"></i></span>
            </div>
            <input class="form-control" formControlName="lastName" name="lastName" placeholder="Last Name" required="required"
                   type="text">
          </div>
        </div>
        <div class="form-group" formGroupName="user">
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fas fa-envelope-open"></i></span>
            </div>
            <input class="form-control" formControlName="emailAddress" name="emailAddress" placeholder="Email"
                   required="required" type="email">
          </div>
        </div>
        <div class="form-group" formGroupName="user">
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fas fa-unlock-alt"></i></span>
            </div>
            <input class="form-control" formControlName="password" name="password" placeholder="Password"
                   required="required"
                   type="password">
          </div>
        </div>

        <div class="form-group" formGroupName="user">
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fas fa-unlock-alt"></i></span>
            </div>
            <input class="form-control" formControlName="repeatPassword" name="repeatPassword" placeholder="Repeat Password"
                   required="required"
                   type="password">
          </div>
        </div>

      </div>
      <div class="col-12">
        <button class="btn btn-bordered w-100 mt-3" type="submit">Sign Up</button>
      </div>
      <div class="col-12">
        <span class="d-block pt-2 mt-4 border-top">Already have an account? <a
          href="/pages">Sign In</a></span>
      </div>
    </div>
  </form>
  <p class="form-message"></p>
</div>
