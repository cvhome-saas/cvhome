<section class="section subscribe-area ptb_100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="subscribe-content text-center">
          <h2>{{ title }}</h2>
          <p class="my-4">{{ message }}</p>
          <form class="subscribe-form">
            <div class="form-group">
              <input [(ngModel)]="email" aria-describedby="emailHelp" class="form-control" id="exampleInputEmail1" name="email"
                     placeholder="Enter your email"
                     type="email">
            </div>
            <button (click)="sub()" class="btn btn-lg btn-block" type="button">Subscribe</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
