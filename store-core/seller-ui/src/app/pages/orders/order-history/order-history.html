<div class="history-box">

  <span class="titleBar">
    <span></span>
    <span class="title_text">{{ 'ORDER_FORM.HISTORY_LIST' | translate }}</span>
    <button (click)="cancel()" aria-label="Close" class="close" type="button"></button>
  </span>
  <div class="tabelSec">
    <table cellpadding="0" cellspacing="0" id="print-section">
      <thead>
      <tr class="heading">
        <th>
          {{ 'ORDER_FORM.ORDER_STATUS' | translate }}
        </th>
        <th style="text-align:center">
          {{ 'ORDER_FORM.DATE' | translate }}
        </th>
        <th>
          {{ 'ORDER_FORM.COMMENT' | translate }}
        </th>
      </tr>
      </thead>
      <tbody>
      @for (history of historyData; track history) {
        <tr class="item">
          <td>
            {{ history.orderStatus }}
          </td>
          <td style="text-align:center">
            {{ history.date }}
          </td>
          <td>
            {{ history.comments }}
          </td>
        </tr>
      }
      </tbody>
    </table>
  </div>
</div>
