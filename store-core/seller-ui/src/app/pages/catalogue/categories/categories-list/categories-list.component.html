<nb-card status="basic" accent="info">
  <nb-card-header>
    <div class="row">
      <h1 class="page_title">{{ 'COMPONENTS.CATEGORIES' | translate }}</h1>
    </div>

    <div class="row">
      <div class="col">
      </div>
      <div class="col col-lg-2">
        <button nbButton status="success" (click)="createCategory()"
                [disabled]="params.store==undefined||params.store==''">
          <label>{{ 'COMPONENTS.CREATE_CATEGORY' | translate }}</label>
        </button>

      </div>
    </div>
  </nb-card-header>

  <nb-card-body [nbSpinner]="isLoading" nbSpinnerSize="large" nbSpinnerStatus="primary">
    <ngx-datatable
      (page)="onPageEvent($event)"
      [columnMode]="ColumnMode.force"
      [count]="page.totalElements"
      [externalPaging]="true"
      [footerHeight]="50"
      [headerHeight]="50"
      [limit]="perPageSize"
      [offset]="page.pageNumber"
      [rows]="page.content"
      class="material"
      rowHeight="auto">

      <ngx-datatable-column name="Id">
        <ng-template let-column="column" ngx-datatable-header-template> {{ 'COMMON.ID' |translate }}</ng-template>
        <ng-template let-value="value" ngx-datatable-cell-template>
          <strong>{{ value }}</strong>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column name="code">
        <ng-template let-column="column" ngx-datatable-header-template> {{ 'COMMON.CODE' |translate }}</ng-template>
        <ng-template let-value="value" ngx-datatable-cell-template>
          <strong>{{ value }}</strong>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column name="parent">
        <ng-template let-column="column" ngx-datatable-header-template> {{ 'CATEGORY.PARENT' |translate }}
        </ng-template>
        <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
          {{ row.parent ? row.parent.code : 'root' }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="visible">
        <ng-template let-column="column" ngx-datatable-header-template> {{ 'COMMON.VISIBLE' |translate }}
        </ng-template>
        <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
          <ngx-categories-visibility [rowData]="row" [store]="row.store"
                                     [value]="row.visible"></ngx-categories-visibility>
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="actions">
        <ng-template let-column="column" ngx-datatable-header-template>
          {{ 'ORDER.ACTIONS' |translate }}
        </ng-template>
        <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
          <button (click)="onEdit(row)" nbButton shape="round" size="small" status="primary">
            <nb-icon icon="edit"></nb-icon>
          </button>
          <button (click)="onDelete(row)" nbButton shape="round" size="small" status="danger">
            <nb-icon icon="trash"></nb-icon>
          </button>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </nb-card-body>
</nb-card>
