<nb-card accent="info" status="basic">
  <nb-card-header>
    <div class="row">
      <h1 class="page_title">{{ 'COMPONENTS.CATEGORIES_HIERARCHY' | translate }}</h1>
    </div>
  </nb-card-header>

  <nb-card-body [nbSpinner]="loader" nbSpinnerSize="large" nbSpinnerStatus="primary">
    <div>
      <ngcx-tree #tree (nodeMoved)="onMoveNode($event)" [nodes]="nodes"></ngcx-tree>
    </div>
  </nb-card-body>
</nb-card>
