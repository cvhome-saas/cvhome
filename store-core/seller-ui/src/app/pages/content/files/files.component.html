<nb-card accent="info" status="basic">
  <nb-card-header>
    <div class="row">
      <h1 class="page_title">{{ 'filemanager.title' | translate }}</h1>
    </div>

    <div class="row">
      <div class="col">
      </div>
      <div class="col col-lg-2">
        <ngx-file-drop (onFileDrop)="dropped($event)" accept="image/*" dropZoneLabel="Drop files here">
          <ng-template let-openFileSelector="openFileSelector" ngx-file-drop-content-tmp>
            <button (click)="openFileSelector()" nbButton status="primary">{{ 'COMMON.BROWSE_FILES' | translate }}
            </button>
          </ng-template>
        </ngx-file-drop>

      </div>
    </div>
  </nb-card-header>
  <nb-card-body [nbSpinner]="loader" nbSpinnerSize="large" nbSpinnerStatus="primary">
    <div [hidden]="files.length==0" class="file_listing_scroll">
      <ul class="file_listing_main">
        <li *ngFor="let images of files;let i=index">
          <div class="file_listing_box">
            <div class="image-title-main">
              <div class="close_main">
                <nb-icon (click)="openImage(files,i)" class="edit"></nb-icon>

                <nb-icon (click)="unSelectImage(i)" icon="trash"></nb-icon>
              </div>
            </div>
            <div class="image_box">
              <img [id]="'blah-'+i" [src]="images.src" class="banner-image"/>
            </div>
          </div>
        </li>
      </ul>
      <button (click)="upload()" [disabled]="files.length==0" nbButton
              status="success">{{ 'filemanager.upload' | translate }}
      </button>
    </div>
    <div class="file_listing_scroll">
      <ul class="file_listing_main">
        <li *ngFor="let image of images;let i=index">
          <div class="file_listing_box">
            <div class="image-title-main">
              <div class="close_main">
                <nb-icon (click)="openImage(images,i)" icon="edit"></nb-icon>
                <nb-icon (click)="removeImage(image.name)" icon="trash"></nb-icon>
              </div>
            </div>
            <div class="image_box">
              <img class="banner-image" src="{{image.src}}"/>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </nb-card-body>
</nb-card>
