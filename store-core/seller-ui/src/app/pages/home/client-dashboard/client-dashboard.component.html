<nb-card accent="info" status="basic">
  <nb-card-header>
    <div class="row">
      <h1 class="page_title">{{ 'COMPONENTS.STATISTICS' | translate }}</h1>
    </div>
    <div class="row">
      <div class="col">
      </div>
      <div class="col col-lg-2">
        <input [formControl]="formService.fromDateControl" [nbDatepicker]="fromDatePicker" [readOnly]="true"
               class="form-control has-person-icon inputText" fullWidth
               nbInput placeholder="Form Picker">
        <nb-datepicker #fromDatePicker (dateChange)="onFromDateChanged($event)"
                       [max]="facade.fromMaxDate"/>
      </div>
      <div class="col col-lg-2">
        <input [formControl]="formService.toDateControl" [nbDatepicker]="toDatePicker" [readOnly]="true"
               class="form-control has-person-icon inputText" fullWidth
               nbInput placeholder="To Picker">
        <nb-datepicker #toDatePicker (dateChange)="onToDateChanged($event)" [max]="facade.toMaxDate"/>
      </div>
    </div>
  </nb-card-header>

  <nb-card-body [nbSpinner]="facade.loading()" nbSpinnerSize="large" nbSpinnerStatus="primary">
    <div class="row">
      <div class="col-lg-12">
        <nb-card accent="info" status="control">
          <nb-card-header>{{ 'STATISTICS.ORDER_STATUS' | translate }}</nb-card-header>
          <nb-card-body>
            <ngx-orders-statistic [data]="facade.ordersData()"></ngx-orders-statistic>
          </nb-card-body>
        </nb-card>
      </div>
      <div class="col-lg-6">
        <nb-card accent="info" status="control">
          <nb-card-header>{{ 'STATISTICS.CUSTOMERS_COUNTRIES_FROM' | translate }}</nb-card-header>
          <nb-card-body>
            <ngx-customer-countries-statistic [data]="facade.customerCountriesData()"></ngx-customer-countries-statistic>
          </nb-card-body>
        </nb-card>
      </div>
      <div class="col-lg-6">
        <nb-card accent="info" status="control">
          <nb-card-header>{{ 'STATISTICS.TOP_SELLING_PRODUCTS' | translate }}</nb-card-header>
          <nb-card-body>
            <ngx-products-statistic [data]="facade.productsData()"></ngx-products-statistic>
          </nb-card-body>
        </nb-card>
      </div>
    </div>
  </nb-card-body>
</nb-card>
