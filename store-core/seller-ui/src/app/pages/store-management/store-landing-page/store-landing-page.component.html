<nb-card accent="info" status="basic">
  <nb-card-header>
    <div class="row">
      <h1 class="page_title">{{ 'STORE.STORE_INFORMATION' | translate }}</h1>
    </div>
    <div class="row">
      <div class="col">
      </div>
      <div class="col col-lg-2">
        <nb-select [(selected)]="selectedItem" fullWidth outline shape="rectangle">
          <nb-option (click)="route(item.link)" *ngFor="let item of sidemenuLinks" [value]="item.id">{{ item.title }}
          </nb-option>
        </nb-select>
      </div>
      <div class="col col-lg-2">
        <button (click)="save()" [nbSpinner]="loader" nbButton nbSpinnerSize="large" nbSpinnerStatus="control"
                status="success"
                type="submit">
          {{ (!loader ? 'COMMON.SAVE' : '') | translate }}
        </button>

      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <form *ngIf="!loader" [formGroup]='form'>
      <nb-select formControlName='selectedLanguage' fullWidth outline placeholder="Language" shape="rectangle">
        <nb-option *ngFor="let lan of languages" [value]="lan.code">{{
            ('LANG.' + lan.code) | translate
          }}
        </nb-option>
      </nb-select>
      <input class="form-control " formControlName='code' fullWidth id="code" nbInput type="hidden">
      <div *ngIf="selectedLanguage.value !== ''" formArrayName='descriptions'>
        <div *ngFor="let descr of descriptions.controls; let j=index">
          <div *ngIf="descr.value.language === selectedLanguage.value">

            <div [formGroupName]="j">

              <div class="form-group">
                <label class="col-sm-10 " for="title">
                  {{ 'STORE_LANDING.LANDING_PAGE_TITLE' | translate }} *
                </label>
                <div class="col-sm-12">
                  <input class="form-control " formControlName='name' fullWidth id="title" nbInput
                         placeholder="Page title"
                         required type="text">
                  <span *ngIf="(descr.get('name').dirty || descr.get('name').touched) && descr.get('name').invalid
                  && descr.get('name').errors.required" class="err-message">
                      {{ 'STORE_LANDING.LANDING_PAGE_TITLE' | translate }}
                    </span>
                </div>
              </div>

              <div class="form-group">
                <label class="col-sm-10  ">{{ 'STORE_LANDING.TAG_DESCRIPTION' | translate }}</label>
                <div class="col-sm-12">
                  <input class="form-control " formControlName='metaDescription' fullWidth id="metaDetails" nbInput
                         placeholder="{{ 'STORE_LANDING.TAG_DESCRIPTION' | translate}}"
                         type="text">
                </div>
              </div>

              <div class="form-group">
                <label class="col-sm-10  ">{{ 'STORE_LANDING.LANDING_TEXT' | translate }}</label>
                <div class="col-sm-12">
                  <quill-editor [styles]="{height: '200px'}" formControlName="description"/>
                </div>
              </div>

            </div>

          </div>
        </div>
      </div>
    </form>
  </nb-card-body>
</nb-card>
