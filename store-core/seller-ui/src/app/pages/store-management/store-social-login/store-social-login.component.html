<nb-card status="basic" accent="info">
  <nb-card-header>
    <div class="row">
      <h1 class="page_title">{{ 'STORE.STORE_SOCIAL_LOGIN' | translate }}</h1>
    </div>
    <div class="row">
      <div class="col">
      </div>
      <div class="col col-lg-2">
        <nb-select fullWidth [(selected)]="selectedItem" outline shape="rectangle">
          <nb-option (click)="route(item.link)" *ngFor="let item of sidemenuLinks" [value]="item.id">{{ item.title }}
          </nb-option>
        </nb-select>
      </div>
      <div class="col col-lg-2">
        <button nbButton status="success" (click)="save()"
                type="submit">
          {{  'COMMON.SAVE'  | translate }}
        </button>

      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()">
      <div formArrayName="configs">
        <div *ngFor="let config of configForms.controls; let i=index" [formGroupName]="i" class="provider-config">
          <h6>{{ config.value.providerId }}</h6>
          <div class="row">
            <div class="col-sm-4">
              <div class="form-group">
                <label class="label">{{ 'STORE.SOCIAL_APP_ID' | translate }}</label>
                <input type="text" nbInput fullWidth formControlName="appId">
              </div>
            </div>
            <div class="col-sm-4">
              <div class="form-group">
                <label class="label">{{ 'STORE.SOCIAL_APP_SECRET' | translate }}</label>
                <input type="password" nbInput fullWidth formControlName="appSecret">
              </div>
            </div>
            <div class="col-sm-4">
              <div class="form-group">
                <nb-checkbox formControlName="enabled">{{ 'STORE.SOCIAL_APP_SECRET' | translate }}</nb-checkbox>
              </div>
            </div>
          </div>
          <hr/>
        </div>
      </div>
      <button nbButton status="primary" type="submit">{{ 'COMMON.SAVE' | translate }}</button>
    </form>

  </nb-card-body>
</nb-card>
