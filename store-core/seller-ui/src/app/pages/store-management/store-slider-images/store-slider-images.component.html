<nb-card accent="info" status="basic">
  <nb-card-header>
    <div class="row">
      <h1 class="page_title">{{ 'STORE.STORE_SLIDER_IMAGES' | translate }}</h1>
    </div>
    <div class="row">
      <div class="col">
      </div>
      <div class="col col-lg-2">
        <nb-select [selected]="facade.selectedItem()" fullWidth outline shape="rectangle">
          <nb-option (click)="facade.route(item.link)" *ngFor="let item of facade.sideMenuLinks" [value]="item.id">{{ item.title }}
          </nb-option>
        </nb-select>
      </div>
      <div class="col col-lg-2">
        <button (click)="facade.save()" nbButton status="success"
                type="submit">
          {{ 'COMMON.SAVE'  | translate }}
        </button>

      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <div *ngIf="facade.sliderImages().length < 8" class="mb-4">
      <h4 class="mb-3">{{ 'STORE.ADD_NEW_SLIDER_IMAGE' | translate }}</h4>
      <div (click)='newImageInput.click()' (dragover)="facade.allowDrop($event)" (drop)="facade.drop($event)"
           class="wrapper image-drop-zone">
        <div #newImageDrop class="position-relative" id="newImageDrop">
          <img *ngIf="facade.newImageData()" [src]="facade.newImageData()" class="img-fluid rounded" style="max-height: 250px"/>
          <div *ngIf="!facade.newImageData()" class="text-center py-5">
            <i class="fas fa-cloud-upload-alt fa-3x text-muted"></i>
            <div class="uploadingPhrase mt-3">{{ 'STORE_BRANDING.DROP_FILE' | translate }}</div>
          </div>
        </div>
      </div>
      <input #newImageInput (change)='facade.newImageChange($event)' accept="image/*" fullWidth id="newImageInput" nbInput
             required type="file">
      <div class="d-flex justify-content-center mt-3">
        <button (click)="facade.saveNewImage(newImageInput)" [disabled]="!facade.newImageData()" class="me-2" nbButton status="primary">
          <i class="fas fa-save me-2"></i>
          {{ 'COMMON.SAVE' | translate }}
        </button>
        <button (click)="facade.resetNewImage(newImageInput)" [disabled]="!facade.newImageData()" nbButton status="danger">
          <i class="fas fa-undo me-2"></i>
          {{ 'COMMON.RESET' | translate }}
        </button>
      </div>
    </div>

    <div class="row g-4">
      <div *ngFor="let image of facade.sliderImages(); index as i" class="col-12 col-md-3">
        <div class="image-container p-3 border rounded">
          <div class="wrapper image-drop-zone mb-2">
            <div #imageDrop id="imageDrop">
              <img [src]="image.url" class="img-fluid rounded" style="max-height: 250px"/>
            </div>
          </div>

          <div class="d-flex justify-content-center gap-2 mt-2">
            <button (click)="facade.moveLeft(i)" [disabled]="i==0" nbButton size="tiny" status="primary">
              <i class="fas fa-arrow-left"></i>
            </button>
            <button (click)="facade.moveRight(i)" [disabled]="i==facade.sliderImages().length-1" nbButton size="tiny" status="primary">
              <i class="fas fa-arrow-right"></i>
            </button>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-2">
            <span class="badge bg-primary">Priority: {{ i }}</span>
            <div class="btn-group gap-2">
              <button (click)="facade.deleteImage(i)" nbButton size="small" status="danger">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </nb-card-body>
</nb-card>
