plugins {
    alias(libs.plugins.java.library.conventions)
}

dependencies {
    api project(':store-core:pod-registry:pod-registry-commons')
    // The reactive gateway and (from phase 6) servlet callers in tenancy both consume this module. The
    // Mono-returning methods live on their own interface so a servlet caller never sees reactor types on its proxy.
    compileOnly libs.spring.web
    compileOnly libs.spring.webflux
    compileOnly libs.caffeine
    compileOnly libs.slf4j.api
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    // The @HttpExchange proxies are exercised in src/test against a MockRestServiceServer.
    testImplementation libs.spring.web
    testImplementation libs.jackson.databind
    testImplementation 'org.springframework:spring-context'
    testImplementation 'org.hamcrest:hamcrest'
    testImplementation 'com.jayway.jsonpath:json-path'
}
