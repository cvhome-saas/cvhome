plugins {
    id 'application'
    id 'java'
    id("com.github.johnrengelman.shadow") version "8.1.1"
}

group = 'com.asrevo.cvhome.kc'

java {
    sourceCompatibility = '21'
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    compileOnly 'org.keycloak:keycloak-core:26.1.3'
    compileOnly 'org.keycloak:keycloak-server-spi:26.1.3'
    compileOnly 'org.keycloak:keycloak-server-spi-private:26.1.3'
    compileOnly 'org.keycloak:keycloak-services:26.1.3'
    compileOnly 'org.keycloak:keycloak-saml-core-public:26.1.3'
    compileOnly 'org.projectlombok:lombok:1.18.36'

    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

mainClassName = "com.asrevo.cvhome.kc.Main"

tasks.jar {
    manifest.attributes["Main-Class"] = mainClassName
}

test {
    useJUnitPlatform()
}