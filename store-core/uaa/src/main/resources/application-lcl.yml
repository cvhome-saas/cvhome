spring:
  config:
    import:
      - "classpath:lcl-config.yml"
      - "classpath:store-core-lcl-config.yml"

# The local defaults for every secret application.yml requires from the environment. They are shared with the
# other services' lcl slices (common-config.yml's web-app registration, tenancy's admin-sdk client) and are local seed
# configuration that never leaves the machine. An exported UAA_* variable still wins over these.
UAA_ADMIN_PASSWORD: admin
UAA_ADMIN_SDK_SECRET: hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7
UAA_STORE_POD_SECRET: hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7
UAA_STORE_CORE_SECRET: hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7
UAA_WEB_APP_SECRET: hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7

com:
  asrevo:
    cvhome:
      uaa:
        seed:
          # A fresh local database gets the known password and secrets on every start.
          apply-on-boot: true
        # Signs the remember-me cookie. Local only; a deployment sets UAA_REMEMBER_ME_KEY.
        remember-me:
          key: local-remember-me-key-not-a-secret
        rate-limit:
          enabled: true
        # Locally the log is the delivery channel: the link an invitation produced is printed so a tester can open it.
        links:
          log-links: true
        # The stack's console and pods answer on plain http under *.gateway.com.
        clients:
          plain-http-hosts:
            - localhost
            - 127.0.0.1
            - gateway.com
            - .gateway.com
      # The key that wraps the signing keys' private halves at rest. Static and committed for a local stack — like every
      # other local secret in this slice — so a restart can still read them. Without it the shared LOCAL provider falls
      # back to a random key per boot, and every stored signing key becomes unreadable at the next start.
      crypto:
        local:
          key-provider-type: STATIC
          key: ${UAA_CRYPTO_KEY:6b8d7f2a9c4e1d3b5a7f9e2c4d6b8a1f3e5d7c9b2a4f6e8d1c3b5a7f9e2d4c6b}
