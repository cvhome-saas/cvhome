<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Consent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }

        form {
            max-width: 560px;
            display: grid;
            gap: 1rem;
        }

        .scopes {
            display: grid;
            gap: .5rem;
            margin-left: 1rem;
        }

        button {
            padding: .6rem 1rem;
            font-size: 1rem;
        }
    </style>
</head>
<body>
<h2>Consent</h2>
<form method="post" th:action="@{/oauth2/consent}">
    <p>The application is requesting the following permissions:</p>
    <div class="scopes">
        <div th:each="scope : ${scopes}">
            <label>
                <input checked name="scope" th:value="${scope}" type="checkbox"/>
                <span th:text="${scope}"></span>
            </label>
        </div>
    </div>
    <div>
        <button name="consent_action" type="submit" value="approve">Approve</button>
        <button name="consent_action" type="submit" value="cancel">Cancel</button>
    </div>
    <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>
    <input name="client_id" th:value="${clientId}" type="hidden"/>
    <input name="state" th:value="${state}" type="hidden"/>
</form>
</body>
</html>
