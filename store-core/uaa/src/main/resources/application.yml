spring:
  application:
    name: uaa
  config:
    import: "classpath:common-config.yml"
  security:
    oauth2:
      client:
        registration:
          s2s:
            provider: uaa
            client-id: store-core@service.store-core.internal
            client-secret: ${UAA_STORE_CORE_SECRET}
            authorization-grant-type: client_credentials
            scope: store_core
  sql:
    init:
      schema-locations: classpath:init-sql/schema.sql
      data-locations: classpath:init-sql/data-common.sql

# The transactional outbox every uaa event goes through (uaa-events). The tables live in the uaa schema and come from
# schema.sql like everything else; the starter's own DDL is off.
namastack:
  outbox:
    multicaster:
      enabled: true
    polling:
      fixed:
        interval: 2s
      batch-size: 10
    jpa:
      schema-initialization:
        enabled: false
      schema-name: ${spring.application.name}

# uaa is the one service whose actuator must not be wide open: a heap dump of an authorization server contains its
# signing key. Only health, info and prometheus are mapped; common-config.yml reads this placeholder, because an
# imported config file outranks the one that imports it and a direct override here would lose.
MANAGEMENT_ENDPOINTS_EXPOSURE: health,info,prometheus

# Every secret below is an environment variable with NO default here. The lcl and test-stores slices supply the local
# values; a deployment that forgets one fails to start rather than running on a committed secret. The seed writers
# that push these values into the database on every boot are off unless a slice turns them on (SeedProperties).
com:
  asrevo:
    cvhome:
      admin:
        password: ${UAA_ADMIN_PASSWORD}
      sso:
        # uaa is the single-realm deployment of the SSO server; cua is the same server with one realm per store.
        # Stated explicitly because the property has no default: a deployment that forgot to say would otherwise
        # pick one, and the two look a user up in very different places.
        realm:
          mode: SINGLE
          fixed: platform
      uaa:
        # The seller console's half of uaa's two front doors. `path-prefix` is store-core-gateway's forward route
        # for uaa and doubles as the switch: a request whose context path is this arrived behind the console, and
        # the console owns every page shown before somebody is signed in. Reached on uaa's own host the context
        # path is empty, nothing here applies, and uaa serves its own SPA — which is how a platform administrator
        # still signs in at uaa's address. Set `path-prefix` to "" to turn the hand-off off entirely.
        console:
          path-prefix: /uaa
        seed:
          apply-on-boot: false
        remember-me:
          key: ${UAA_REMEMBER_ME_KEY}
        rate-limit:
          enabled: true
        # One-time links: how long an invitation and a reset link stay usable, and whether the logging consumer
        # writes the link itself (never in a deployment — the link is a credential).
        # `base-url` and the two page paths point the one-time links at the console, which renders those pages
        # now. `invitation-page` is deliberately not `/accept-invitation`: the console already has a route by that
        # name for a different thing — an organization inviting a member, accepted against tenancy by somebody
        # already signed in — and two token systems on one path is a bug waiting for the first person holding both
        # kinds of link. Leave `base-url` empty and the links fall back to the issuer and uaa's own pages.
        links:
          invitation-validity: P7D
          reset-validity: PT1H
          log-links: false
          base-url: ${com.asrevo.cvhome.services.store-core-gateway.schema}://${com.asrevo.cvhome.services.store-core-gateway.domain}:${com.asrevo.cvhome.services.store-core-gateway.port}
          invitation-page: /invitation
          reset-password-page: /reset-password
        # Registered clients: the hosts a redirect URI may use over plain http. Everything else must be https.
        # An entry starting with a dot matches every subdomain. Local slices add the stack's own hosts.
        clients:
          plain-http-hosts:
            - localhost
            - 127.0.0.1
      oauth2:
        clients:
          admin-sdk:
            secret: ${UAA_ADMIN_SDK_SECRET}
          # Bracketed, because these keys carry '@' and '.'. Unbracketed, Spring's binder splits a map
          # key at every dot, so neither client ever reached OAuth2ClientProperties: the seed writer
          # updated admin-sdk and web-app and silently left both service clients on the SQL seed's
          # secret, and the first deployment with generated secrets locked every service out.
          "[store-pod-507f1f77@service.store-pod.internal]":
            secret: ${UAA_STORE_POD_SECRET}
          "[store-core@service.store-core.internal]":
            secret: ${UAA_STORE_CORE_SECRET}
          web-app:
            secret: ${UAA_WEB_APP_SECRET}
            redirect-uri-paths:
              - "/login/oauth2/code/uaa"
            post-logout-redirect-uri-paths:
              - ""
