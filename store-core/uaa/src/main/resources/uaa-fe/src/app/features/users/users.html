<ng-container *transloco="let t">
  <app-page-header [title]="t('users.title')" [context]="t('users.context')" />

  @if (facade.error(); as failure) {
    <app-load-error [message]="failure.message" (retry)="facade.reload()" />
  }

  <app-busy-overlay reserve="page" [busy]="facade.isLoading()" [label]="t('users.loading')">
    @if (!facade.isEmpty()) {
      <div class="stack">
        <!--
          Said once at the top rather than as a search box that would narrow nothing: uaa's admin
          list matches metadata equality and has no text query at all.
        -->
        <app-notice-bar icon="info" tone="blue" [message]="t('users.notice.noSearch')" />

        <app-panel [title]="t('users.panel.title')">
          @if (facade.rows().length) {
            <app-user-admin-table
              [rows]="facade.rows()"
              [label]="t('users.panel.title')"
              [busy]="facade.busy()"
              [roleList]="roleList"
              (act)="onAction($event)"
            />

            <app-pagination
              [page]="facade.pageIndex()"
              [totalPages]="facade.totalPages()"
              [totalElements]="facade.totalElements()"
              [pageSize]="pageSize"
              [unit]="t('users.unit')"
              [label]="t('users.paginationLabel')"
              (pageChange)="facade.goToPage($event)"
            />
          } @else {
            <app-empty-state
              icon="users"
              [title]="t('users.empty.title')"
              [message]="t('users.empty.message')"
            />
          }
        </app-panel>
      </div>
    }
  </app-busy-overlay>

  <app-set-password-dialog
    [open]="!!facade.resetting()"
    [busy]="facade.busy()"
    [title]="t('users.reset.title')"
    [message]="t('users.reset.message', {name: userName(facade.resetting())})"
    [passwordLabel]="t('users.reset.password')"
    [repeatLabel]="t('users.reset.repeatPassword')"
    [hint]="t('users.reset.hint')"
    [handoverHint]="t('users.reset.handoverHint')"
    [weakMessage]="t('users.reset.weak')"
    [mismatchMessage]="t('users.reset.mismatch')"
    [confirmLabel]="t('users.reset.confirm')"
    [busyLabel]="t('users.reset.busy')"
    [cancelLabel]="t('shared.actions.cancel')"
    (submitted)="facade.confirmReset($event)"
    (dismissed)="facade.dismissDialogs()"
  />

  @if (facade.editingRoles(); as target) {
    <app-roles-dialog
      [open]="true"
      [busy]="facade.busy()"
      [title]="t('users.roles.title')"
      [message]="t('users.roles.message', {name: userName(target)})"
      [options]="facade.roleOptions()"
      [held]="target.roles"
      [emptyMessage]="t('users.roles.empty')"
      [confirmLabel]="t('users.roles.confirm')"
      [busyLabel]="t('users.roles.busy')"
      [cancelLabel]="t('shared.actions.cancel')"
      (submitted)="facade.confirmRoles($event)"
      (dismissed)="facade.dismissDialogs()"
    />
  }

  <!--
    Typed confirmation: there is no undo and no soft delete. uaa refuses outright when the target is
    the platform's own super admin, and that refusal is shown rather than predicted.
  -->
  <app-confirm-dialog
    [open]="!!facade.deleting()"
    [title]="t('users.delete.title')"
    [message]="t('users.delete.message', {name: userName(facade.deleting())})"
    [confirmationText]="facade.deleting()?.username ?? null"
    [confirmationLabel]="t('users.delete.confirmationLabel')"
    [confirmLabel]="t('users.delete.confirm')"
    [cancelLabel]="t('shared.actions.cancel')"
    (confirmed)="facade.confirmDelete()"
    (dismissed)="facade.dismissDialogs()"
  />
</ng-container>
