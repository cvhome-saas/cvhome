<ng-container *transloco="let t">
  <app-page-header [title]="t('roles.title')" [context]="t('roles.context')" />

  @if (facade.error(); as failure) {
    <app-load-error [message]="failure.message" (retry)="facade.reload()" />
  }

  <app-busy-overlay reserve="page" [busy]="facade.isLoading()" [label]="t('roles.loading')">
    @if (!facade.isEmpty()) {
      <div class="stack">
        <!--
          Renaming does not re-issue a token: a principal signed in under the old authority keeps it
          until their next login. Said here because it is uaa's behaviour and nothing here can hide it.
        -->
        <app-notice-bar icon="info" tone="amber" [message]="t('roles.notice.rename')" />

        @if (facade.editing(); as target) {
          <app-panel
            padded
            [title]="target === 'new' ? t('roles.form.createTitle') : t('roles.form.renameTitle')"
          >
            <form class="form" [formGroup]="facade.form" (ngSubmit)="facade.save()">
              <app-form-field
                controlId="role-name"
                required
                [label]="t('roles.form.name')"
                [control]="facade.form.controls.name"
                [hint]="t('roles.form.nameHint')"
              >
                <app-text-field
                  formControlName="name"
                  id="role-name"
                  latin
                  mono
                  [placeholder]="t('roles.form.namePlaceholder')"
                />
              </app-form-field>

              <div class="actions">
                <button class="ghost" type="button" (click)="facade.dismiss()">
                  {{ t('shared.actions.cancel') }}
                </button>
                <button class="primary" type="submit" [disabled]="facade.busy()">
                  {{ facade.busy() ? t('roles.form.saving') : t('roles.form.save') }}
                </button>
              </div>
            </form>
          </app-panel>
        }

        <app-panel [title]="t('roles.panel.title')">
          <button panelAction class="primary" type="button" (click)="facade.startCreate()">
            {{ t('roles.action.create') }}
          </button>

          @if (facade.rows().length) {
            <app-data-table [columns]="translatedColumns(t)" [label]="t('roles.panel.title')">
              @for (role of facade.rows(); track role.id) {
                <app-table-row>
                  <span class="cell name">{{ role.name }}</span>
                  <span class="cell id">{{ role.id }}</span>
                  <span class="cell row-actions">
                    <button class="ghost" type="button" (click)="facade.startRename(role)">
                      {{ t('roles.action.rename') }}
                    </button>
                    <button class="ghost danger" type="button" (click)="facade.deleting.set(role)">
                      {{ t('roles.action.delete') }}
                    </button>
                  </span>
                </app-table-row>
              }
            </app-data-table>

            <app-pagination
              [page]="facade.pageIndex()"
              [totalPages]="facade.totalPages()"
              [totalElements]="facade.totalElements()"
              [pageSize]="pageSize"
              [unit]="t('roles.unit')"
              [label]="t('roles.paginationLabel')"
              (pageChange)="facade.goToPage($event)"
            />
          } @else {
            <app-empty-state
              icon="shield"
              [title]="t('roles.empty.title')"
              [message]="t('roles.empty.message')"
            />
          }
        </app-panel>
      </div>
    }
  </app-busy-overlay>

  <!--
    Typed confirmation on the role name: deleting one silently strips an authority from every account
    that holds it, and uaa gives no warning about how many that is.
  -->
  <app-confirm-dialog
    [open]="!!facade.deleting()"
    [title]="t('roles.delete.title')"
    [message]="t('roles.delete.message', {name: facade.deleting()?.name ?? ''})"
    [confirmationText]="facade.deleting()?.name ?? null"
    [confirmationLabel]="t('roles.delete.confirmationLabel')"
    [confirmLabel]="t('roles.action.delete')"
    [cancelLabel]="t('shared.actions.cancel')"
    (confirmed)="facade.confirmDelete()"
    (dismissed)="facade.dismiss()"
  />
</ng-container>
