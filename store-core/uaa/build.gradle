plugins {
    alias(libs.plugins.java.application.conventions)
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.node)
//    alias(libs.plugins.graalvm)
}
group = 'com.asrevo.cvhome'

springBoot {
    buildInfo()
}

bootBuildImage {
/*
	builder = "bellsoft/buildpacks.builder:musl"
*/
    environment["BP_JVM_JLINK_ENABLED"] = "true"
    environment["BP_JVM_JLINK_ARGS"] = " --compress zip-6 --no-header-files --no-man-pages --vm client --add-modules java.base,java.se,jdk.unsupported,jdk.crypto.ec"
    imageName = createImageName("store-core/uaa", project.version)
    tags = createImageTags("store-core/uaa", project.version)
    docker {
        publishRegistry {
            url = System.getenv("REGISTRY")
            username = System.getenv("ECR_TOKEN") ? 'AWS' : null
            password = System.getenv("ECR_TOKEN")
        }
    }
}

dependencies {
    /*
     * The SSO server itself. uaa is a shell around it: this module supplies the deployment's identity — the pinned
     * issuer, the single realm, the seeds and the embedded admin SPA — and sso-core supplies everything else. The
     * starters arrive transitively from sso-core on purpose; re-listing them here is how the two deployments drift.
     */
    implementation project(':store-commons:sso:sso-core')

    implementation libs.spring.cloud.starter
    implementation project(':store-commons:ecs-commons:fargate-task-info')
    implementation project(':store-commons:ecs-commons:ecs-service-discoveryclient')

    compileOnly libs.lombok
    runtimeOnly libs.postgresql

    implementation libs.spring.boot.starter.opentelemetry
    implementation libs.io.opentelemetry.instrumentation.opentelemetry.spring.boot.starter

    annotationProcessor libs.lombok
    testImplementation project(':store-commons:test-support')
    /*
     * The admin SDK, so uaa's integration tests can drive it against uaa itself. Test-only and deliberately not an
     * `implementation`: uaa is the server this client talks to, and nothing in uaa's own code may depend on it.
     * Nothing else verifies the two against each other — tenancy is the SDK's only production consumer and its
     * tests mock the SDK out.
     */
    integrationTestImplementation project(':store-commons:uaa-client-impl')
    integrationTestImplementation libs.spring.boot.starter.actuator.test
    integrationTestImplementation libs.spring.boot.starter.data.jpa.test
    integrationTestImplementation libs.spring.boot.starter.security.oauth2.authorization.server.test
    integrationTestImplementation libs.spring.boot.starter.security.oauth2.resource.server.test
    integrationTestImplementation libs.spring.boot.starter.session.jdbc.test
    integrationTestImplementation libs.spring.boot.starter.validation.test
    integrationTestImplementation libs.spring.boot.starter.webmvc.test
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.0"
        mavenBom "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${libs.versions.opentelemetryInstrumentationBom.get()}"
    }
}

node {
    version = '23.8.0'
    download = true
    nodeProjectDir = file('src/main/resources/uaa-fe')
}

/*
 * uaa-fe links the shared Angular library as a file: dependency, and npm reads that directory's
 * package.json when it resolves one — so the kit has to be built before this module installs.
 * Without this a clean checkout installs happily, writes a dangling symlink, and fails later with
 * `Could not resolve "@cvhome-saas/ui-kit"`.
 */
tasks.named('npmInstall') {
    dependsOn ':store-commons:ui-kit:build'
}

tasks.register('copyAngularApp', Copy) {
    dependsOn('npm_run_build')
    from("${projectDir}/src/main/resources/uaa-fe/dist/uaa-fe/browser")
    into "${project.projectDir}/src/main/resources/static"
}

tasks.named('processResources') {
    dependsOn(tasks.named('copyAngularApp'))
    exclude 'uaa-fe/**'
}

tasks.named('clean') {
    delete "${project.projectDir}/src/main/resources/static"
}

/*
 * The SSO schema is generated from sso-core's template with this deployment's schema name substituted, rather than
 * kept as a second hand-maintained copy. A column added to one deployment and not the other is a failure that only
 * shows up on whichever one nobody was testing, which is the shape of drift this whole refactor exists to end.
 */
def ssoSchemaName = "uaa"
def ssoSchemaTemplate = project(":store-commons:sso:sso-core").file("src/main/resources/sso/schema-template.sql")
def ssoSchemaOut = layout.buildDirectory.dir("generated/sso-schema")

def generateSsoSchema = tasks.register("generateSsoSchema") {
    inputs.file(ssoSchemaTemplate)
    inputs.property("schema", ssoSchemaName)
    outputs.dir(ssoSchemaOut)
    doLast {
        def target = ssoSchemaOut.get().file("init-sql/schema.sql").asFile
        target.parentFile.mkdirs()
        target.text = ssoSchemaTemplate.text.replace("@@SCHEMA@@", ssoSchemaName)
    }
}

sourceSets.main.resources.srcDir(generateSsoSchema)

