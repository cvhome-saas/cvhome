plugins {
    alias(libs.plugins.java.application.conventions)
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.spring.javaformat)
    alias(libs.plugins.node)
//    alias(libs.plugins.graalvm)
}
group = 'com.asrevo.cvhome'


springBoot {
    buildInfo()
}

bootBuildImage {
/*
	builder = "bellsoft/buildpacks.builder:musl"
*/
    environment["BP_JVM_JLINK_ENABLED"] = "true"
    environment["BP_JVM_JLINK_ARGS"] = " --compress zip-6 --no-header-files --no-man-pages --vm client --add-modules java.base,java.se,jdk.unsupported,jdk.crypto.ec"
    imageName = createImageName("store-core/store-core-gateway", project.version)
    tags = createImageTags("store-core/store-core-gateway", project.version)
    docker {
        publishRegistry {
            url = System.getenv("REGISTRY")
            username = System.getenv("ECR_TOKEN") ? 'AWS' : null
            password = System.getenv("ECR_TOKEN")
        }
    }
}

dependencies {
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.boot.starter.oauth2.authorization.server
    implementation libs.spring.boot.starter.security.oauth2.resource.server
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.thymeleaf
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.session.jdbc
    implementation libs.spring.cloud.starter
    implementation libs.thymeleaf.extras.springsecurity6
    implementation libs.springdoc.openapi.starter.webmvc.ui

    implementation project(':store-commons:ecs-commons:fargate-task-info')
    implementation project(':store-commons:ecs-commons:ecs-service-discoveryclient')

    implementation project(':store-commons:autoconfigure')

    compileOnly libs.lombok
    runtimeOnly libs.postgresql
    annotationProcessor libs.lombok
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter.actuator.test
    testImplementation libs.spring.boot.starter.data.jpa.test
    testImplementation libs.spring.boot.starter.security.oauth2.authorization.server.test
    testImplementation libs.spring.boot.starter.security.oauth2.resource.server.test
    testImplementation libs.spring.boot.starter.session.jdbc.test
    testImplementation libs.spring.boot.starter.thymeleaf.test
    testImplementation libs.spring.boot.starter.validation.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testImplementation libs.spring.boot.testcontainers
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.postgresql
    testRuntimeOnly libs.junit.platform.launcher
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.0"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

node {
    version = '23.8.0'
    download = true
    nodeProjectDir = file('src/main/resources/uaa-fe')
}

tasks.register('copyAngularApp', Copy) {
    dependsOn('npm_run_build')
    from("${projectDir}/src/main/resources/uaa-fe/dist/uaa-fe/browser")
    into "${project.projectDir}/src/main/resources/static"
}

tasks.named('processResources') {
    dependsOn(tasks.named('copyAngularApp'))
    exclude 'uaa-fe/**'
}

tasks.named('clean') {
    delete "${project.projectDir}/src/main/resources/static"
}