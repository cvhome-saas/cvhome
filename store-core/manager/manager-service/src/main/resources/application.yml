---
spring:
  application:
    name: manager
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: manager
  cloud:
    function:
      definition: events
    stream:
      input-bindings: events
      bindings:
        events-in-0:
          destination: events
          group: ${spring.application.name}
        events-out-0:
          content-type: application/json
          destination: events
server:
  forward-headers-strategy: NATIVE
  port: ${com.asrevo.cvhome.services.manager.port}
info:
  app:
    name: ${spring.application.name}
management:
  observations:
    key-values:
      application: ${spring.application.name}