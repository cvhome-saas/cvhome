spring:
  application:
    name: manager
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: manager
server:
  forward-headers-strategy: FRAMEWORK
  port: ${com.asrevo.cvhome.services.manager.port}
info:
  app:
    name: ${spring.application.name}
management:
  observations:
    key-values:
      application: ${spring.application.name}