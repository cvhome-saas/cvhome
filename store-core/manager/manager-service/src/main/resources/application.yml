            client-id: manager@service.store-core.internal
            client-secret: VobDxIhAGZz8hyhzz7p9G7QpfixjFjzW
            authorization-grant-type: client_credentials
com:
  asrevo:
    cvhome:
      kc:
        credentials:
          server-url: ${com.asrevo.cvhome.services.core-auth.schema}://${com.asrevo.cvhome.services.core-auth.domain}:${com.asrevo.cvhome.services.core-auth.port}
          realm: cvhome
