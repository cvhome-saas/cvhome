spring:
  application:
    name: tenancy
  config:
    import: "classpath:common-config.yml"
  security:
    oauth2:
      client:
        registration:
          s2s:
            provider: uaa
            client-id: store-core@service.store-core.internal
            client-secret: ${UAA_ADMIN_SDK_SECRET:hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7}
            authorization-grant-type: client_credentials
            scope: store_core
com:
  asrevo:
    cvhome:
      s2s:
        # Tenancy owns the store records and checks an org admin's store itself, in
        # InternalStoreService#getManagerStoreEntity — and answers a foreign store with "not found" rather than
        # "forbidden", so that asking about somebody else's store does not confirm it exists. A permission gate
        # can only say yes or no, so it stays out of this one. Every other service leaves this at ENFORCED.
        store-ownership: DELEGATED
      uaa:
        client:
          client-id: admin-sdk
          client-secret: ${UAA_ADMIN_SDK_SECRET:hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7}
          base-url: ${com.asrevo.cvhome.services.uaa.schema}://${com.asrevo.cvhome.services.uaa.domain}:${com.asrevo.cvhome.services.uaa.port}
namastack:
  outbox:
    multicaster:
      enabled: true
    polling:
      fixed:
        interval: 2s
      batch-size: 10
    jdbc:
      schema-initialization:
        enabled: false
      schema-name: tenancy_outbox
