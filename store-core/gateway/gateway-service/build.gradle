plugins {
    id 'com.asrevo.java-application-conventions'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
//    id 'org.graalvm.buildtools.native' version '0.10.5'
}
apply from: "$rootDir/build-logic/helpers/common-methods.gradle"
group = 'com.asrevo.cvhome'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

springBoot {
    buildInfo()
}

bootBuildImage {
/*
    builder = "bellsoft/buildpacks.builder:musl"
*/
    environment["BP_JVM_JLINK_ENABLED"] = "true"
    environment["BP_JVM_JLINK_ARGS"] = " --compress zip-6 --no-header-files --no-man-pages --vm client --add-modules java.base,java.se,jdk.unsupported,jdk.crypto.ec"
    imageName = createImageName("store-core/store-core-gateway", project.version)
    tags = createImageTags("store-core/store-core-gateway", project.version)
    docker {
        publishRegistry {
            url = System.getenv("REGISTRY")
            username = System.getenv("ECR_TOKEN") ? 'AWS' : null
            password = System.getenv("ECR_TOKEN")
        }
    }
}

ext {
    set('springCloudVersion', "2024.0.1")
}
dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.0'


    implementation project(':store-commons:commons')
    implementation project(':store-core:manager:manager-external-api')
    implementation project(':store-commons:autoconfigure')
    implementation project(':store-commons:ecs-commons:fargate-task-info')
    implementation project(':store-commons:ecs-commons:ecs-service-discoveryclient')
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
}

//tasks.withType(org.springframework.boot.gradle.tasks.aot.ProcessAot).configureEach {
//    args('--spring.profiles.active=lcl')
//}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}
