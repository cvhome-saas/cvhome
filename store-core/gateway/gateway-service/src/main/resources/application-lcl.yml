spring:
  cloud:
    local:
      discovery:
        enabled: true
        services:
          auth:
            - url: "http://localhost:9999"
              metadata:
                service-name: auth
                instance: auth-1
          manager:
            - url: "http://localhost:7001"
              metadata:
                service-name: manager
                instance: manager-1
          wallet:
            - url: "http://localhost:7002"
              metadata:
                service-name: wallet
                instance: wallet-1
          store-ui:
            - url: "http://localhost:4200"
              metadata:
                service-name: store-ui
                instance: store-ui-1
          store:
            - url: "http://localhost:7101"
              metadata:
                service-name: store
                instance: store-1
          landing-ui:
            - url: "http://localhost:7102"
              metadata:
                service-name: landing-ui
                instance: landing-ui-1
    gateway:
      discovery:
        locator:
          enabled: true
      default-filters:
        - TokenRelay
        - PreserveHostHeader
        - AddResponseHeader=X-Frame-Options, SAMEORIGIN
      routes:
        - id: store
          order: -3
          uri: ${com.asrevo.cvhome.services.store-pod-gateway.schema}://${com.asrevo.cvhome.services.store-pod-gateway.domain}:${com.asrevo.cvhome.services.store-pod-gateway.port}
          predicates:
            - Path=/store/**
        - id: manager
          order: -2
          uri: lb://manager
          predicates:
            - Path=/manager/**
          filters:
            - StripPrefix=1
        - id: store-ui
          order: -1
          uri: lb://store-ui
          predicates:
            - FNotService=store,manager,wallet,auth
            - FHost=store-ui.${com.asrevo.cvhome.services.store-core-gateway.domain}