spring:
  cloud:
    local:
      discovery:
        enabled: true
        services:
          auth:
            - url: "http://localhost:9999"
              metadata:
                service-name: auth
                instance: auth-1
          manager:
            - url: "http://localhost:8020"
              metadata:
                service-name: manager
                instance: manager-1
          subscription:
            - url: "http://localhost:8021"
              metadata:
                service-name: subscription
                instance: subscription-1
          store-ui:
            - url: "http://localhost:8010"
              metadata:
                service-name: store-ui
                instance: store-ui-1
          welcome-ui:
            - url: "http://localhost:8011"
              metadata:
                service-name: welcome-ui
                instance: welcome-ui-1
          'store-pod-gateway':
            - url: "http://localhost:8100"
              metadata:
                service-name: store-pod-gateway
                instance: store-pod-gateway-1
          'store-pod-gateway.store-pod-1.cvhome.lcl':
            - url: "http://localhost:8100"
              metadata:
                service-name: store-pod-gateway
                instance: store-pod-gateway-1
    gateway:
      discovery:
        locator:
          enabled: false
com:
  asrevo:
    cvhome:
      pods:
        - id:
            id: 1
          name: default
          endpoint:
            endpoint: store-pod-1.cvhome.lcl
            type: EXTERNAL
