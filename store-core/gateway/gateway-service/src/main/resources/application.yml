spring:
  application:
    name: store-core-gateway
  config:
    import: "classpath:common-config.yml"
  security:
    oauth2:
      client:
        registration:
          s2s:
            provider: uaa
            client-id: store-core@service.store-core.internal
            client-secret: hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7
            authorization-grant-type: client_credentials
            scope: store_core
          # The impersonation client: token exchange only, and the one holder of the grant. Its secret is
          # UAA_IMPERSONATION_SECRET; the default is the local seed, like web-app's in common-config.yml.
          console-impersonation:
            provider: uaa
            client-id: console-impersonation
            client-secret: ${UAA_IMPERSONATION_SECRET:hLwOF59NEOdMzYYrfxUbQEGVK1uTczj7}
            authorization-grant-type: urn:ietf:params:oauth:grant-type:token-exchange
server:
  reactive:
    session:
      cookie:
        # The console's session. Boot builds the cookie resolver from these (it backs off if the application defines
        # a WebSessionIdResolver bean, which is why SecurityConfig no longer does). SameSite=Lax is the CSRF answer
        # for this gateway: CSRF is disabled on it because it is a bearer-first relay — every backend call carries the
        # session's token, not a form — and the console's writes are JSON, which a cross-site form cannot send
        # without a preflight. The session cookie riding along on a cross-site POST or DELETE to
        # /api/v1/impersonation was the path that preflight did not close; a Lax cookie is not sent on one
        # (authorization audit, A11). Lax rather than Strict so the return leg of the uaa login, a top-level
        # navigation back to this origin, still carries the session that holds the authorization request.
        name: STORE-CORE-GATEWAY-JSESSIONID
        path: /
        same-site: lax
com:
  asrevo:
    cvhome:
      gateway:
        # The path this gateway forwards uaa under, and the reason logout works. uaa is reached on the console's
        # own origin now, so its session cookie is scoped to `/uaa` here; an end-session call sent to uaa's own
        # host carries no cookie, ends nothing, and leaves the next navigation signed straight back in. Read by
        # ReactiveGatewaySecurityConfig; the route itself is GatewayRouteLocatorImpl.UAA_PREFIX.
        uaa-path-prefix: /uaa
