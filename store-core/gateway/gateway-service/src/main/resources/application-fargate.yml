spring:
  cloud:
    loadbalancer:
      eager-load:
        clients:
          - "store-core-gateway"
          - "manager"
          - "wallet"
          - "store-ui"
    ecs:
      discovery:
        namespace: "store-core.cvhome.lcl"
        namespace-id: "ns-aacm3spcnftheq3b"
        enabled: true
        default-port: 8080
        service-ports:
          "store-core-gateway": 7000
          "manager": 7001
          "wallet": 7002
          "store-ui": 4300
    gateway:
      discovery:
        locator:
          enabled: true
      default-filters:
        - TokenRelay
        - PreserveHostHeader
        - AddResponseHeader=X-Frame-Options, SAMEORIGIN
      routes:
        - id: store-ui
          uri: lb://store-ui
          predicates:
            - FHost=store-ui.${com.asrevo.cvhome.services.core-gateway.domain}
