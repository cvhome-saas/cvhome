<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.css">
<style>
html,body{margin:0;padding:0}
body{background:#05140f;font-family:Inter,system-ui,sans-serif;color:#e6efeb;-webkit-font-smoothing:antialiased}
a{color:#34d399;text-decoration:none}
a:hover{color:#6ee7b7}
*{box-sizing:border-box}
::selection{background:#065f46;color:#ecfdf5}
@keyframes sk-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes sk-in{from{opacity:0}to{opacity:1}}
@keyframes sk-drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,10px)}}
</style>
</helmet>

<div style="min-height:100vh;min-width:1100px;background:#05140f;display:grid;grid-template-columns:1fr 1fr">

  <div style="position:relative;padding:2.5rem 3.5rem;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid rgba(255,255,255,.07)">
    <div style="position:absolute;top:-220px;left:-160px;width:720px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.24),transparent 68%);filter:blur(20px);animation:sk-drift 14s ease-in-out infinite"></div>
    <a href="cvhome Marketing.dc.html" style="position:relative;display:inline-flex;align-items:center;gap:.6rem;font:600 1rem Inter,sans-serif;color:#fff;letter-spacing:-.02em">
      <i class="pi pi-arrow-left" style="font-size:.7rem;color:rgba(230,239,235,.6)"></i>cvhome
    </a>

    <div style="position:relative;margin:auto 0;max-width:32rem;animation:sk-up .55s ease both">
      <div style="display:inline-flex;align-items:center;gap:.6rem;padding:.4rem .9rem;border:1px solid rgba(52,211,153,.35);border-radius:999px;font:500 .75rem Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6ee7b7">14 days free</div>
      <h1 style="margin:1.75rem 0 0;font:300 3rem/1.12 Inter,sans-serif;color:#fff;letter-spacing:-.035em">{{ formHeading }}</h1>
      <p style="margin:1.5rem 0 0;max-width:34ch;font:300 1.0625rem/1.75 Inter,sans-serif;color:rgba(230,239,235,.6);text-wrap:pretty">{{ formCopy }}</p>

      <div style="margin-top:3rem;display:flex;flex-direction:column;gap:1rem">
        <sc-for list="{{ points }}" as="p" hint-placeholder-count="3">
          <div style="display:flex;align-items:flex-start;gap:.75rem">
            <i class="pi pi-check" style="margin-top:.28rem;font-size:.7rem;color:#34d399"></i>
            <span style="font:300 .9375rem/1.6 Inter,sans-serif;color:rgba(230,239,235,.7)">{{ p.text }}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="position:relative;font:300 .8125rem Inter,sans-serif;color:rgba(230,239,235,.45)">Trusted by 1,400 merchants across 26 markets.</div>
  </div>

  <div style="display:flex;align-items:center;justify-content:center;padding:3rem">
    <div style="width:100%;max-width:26rem;background:rgba(4,18,13,.6);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:1.75rem;animation:sk-up .55s .08s ease both">
      <div style="display:flex;padding:.25rem;background:rgba(255,255,255,.06);border-radius:999px;gap:.2rem">
        <div onClick="{{ showSignUp }}" style="{{ signUpTab }}">Create account</div>
        <div onClick="{{ showSignIn }}" style="{{ signInTab }}">Sign in</div>
      </div>

      <div style="margin-top:1.5rem;display:flex;flex-direction:column;gap:1rem">
        <sc-if value="{{ isSignUp }}" hint-placeholder-val="{{ true }}">
          <div style="animation:sk-in .25s ease both">
            <label style="display:block;font:500 .75rem Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(230,239,235,.68);margin-bottom:.5rem">Name</label>
            <div style="padding:.75rem .9rem;border:1px solid rgba(255,255,255,.14);border-radius:10px;font:400 .9375rem Inter,sans-serif;color:#fff;transition:border-color .2s,background-color .2s" style-hover="border-color:rgba(52,211,153,.55);background:rgba(16,185,129,.06)">Jordan Diaz</div>
          </div>
        </sc-if>
        <div>
          <label style="display:block;font:500 .75rem Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(230,239,235,.68);margin-bottom:.5rem">Email</label>
          <div style="padding:.75rem .9rem;border:1px solid rgba(255,255,255,.14);border-radius:10px;font:400 .9375rem Inter,sans-serif;color:#fff;transition:border-color .2s,background-color .2s" style-hover="border-color:rgba(52,211,153,.55);background:rgba(16,185,129,.06)">jordan@acmesupply.co</div>
        </div>
        <div>
          <label style="display:block;font:500 .75rem Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(230,239,235,.68);margin-bottom:.5rem">Password</label>
          <div style="display:flex;align-items:center;gap:.6rem;padding:.75rem .9rem;border:1px solid rgba(255,255,255,.14);border-radius:10px;transition:border-color .2s,background-color .2s" style-hover="border-color:rgba(52,211,153,.55);background:rgba(16,185,129,.06)">
            <span style="flex:1;font:400 .9375rem Inter,sans-serif;color:rgba(230,239,235,.68)">••••••••••••</span>
            <i class="pi pi-eye" style="font-size:.8rem;color:rgba(230,239,235,.68);cursor:pointer"></i>
          </div>
        </div>

        <sc-if value="{{ isSignIn }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:.6rem;animation:sk-in .25s ease both">
            <div style="width:16px;height:16px;border:1px solid rgba(255,255,255,.22);border-radius:4px;cursor:pointer"></div>
            <span style="flex:1;font:400 .8125rem Inter,sans-serif;color:rgba(230,239,235,.68)">Keep me signed in</span>
            <span style="font:500 .8125rem Inter,sans-serif;color:#34d399;cursor:pointer">Forgot password?</span>
          </div>
        </sc-if>

        <a href="{{ submitHref }}" style="display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.5rem;padding:.9rem;background:#10b981;color:#04120d;border-radius:999px;font:600 .9375rem Inter,sans-serif;transition:background-color .2s,box-shadow .2s" style-hover="background:#34d399;box-shadow:0 10px 28px rgba(16,185,129,.4)">{{ submitLabel }}<i class="pi pi-arrow-right" style="font-size:.7rem"></i></a>

        <div style="display:flex;align-items:center;gap:.85rem;margin-top:.25rem">
          <div style="flex:1;height:1px;background:rgba(255,255,255,.1)"></div>
          <span style="font:400 .75rem Inter,sans-serif;color:rgba(230,239,235,.64)">or</span>
          <div style="flex:1;height:1px;background:rgba(255,255,255,.1)"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem">
          <div style="display:flex;align-items:center;justify-content:center;padding:.7rem;border:1px solid rgba(255,255,255,.12);border-radius:10px;cursor:pointer;transition:border-color .2s,background-color .2s" style-hover="border-color:rgba(52,211,153,.45);background:rgba(16,185,129,.07)"><i class="pi pi-google" style="font-size:.9rem;color:#e6efeb"></i></div>
          <div style="display:flex;align-items:center;justify-content:center;padding:.7rem;border:1px solid rgba(255,255,255,.12);border-radius:10px;cursor:pointer;transition:border-color .2s,background-color .2s" style-hover="border-color:rgba(52,211,153,.45);background:rgba(16,185,129,.07)"><i class="pi pi-microsoft" style="font-size:.9rem;color:#e6efeb"></i></div>
          <div style="display:flex;align-items:center;justify-content:center;padding:.7rem;border:1px solid rgba(255,255,255,.12);border-radius:10px;cursor:pointer;transition:border-color .2s,background-color .2s" style-hover="border-color:rgba(52,211,153,.45);background:rgba(16,185,129,.07)"><i class="pi pi-apple" style="font-size:.9rem;color:#e6efeb"></i></div>
        </div>
        <p style="margin:.25rem 0 0;font:300 .75rem/1.6 Inter,sans-serif;color:rgba(230,239,235,.64)">{{ legalNote }}</p>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;signin&quot;,&quot;signup&quot;],&quot;default&quot;:&quot;signin&quot;,&quot;tsType&quot;:&quot;'signin' | 'signup'&quot;}}">
class Component extends DCLogic {
  state = { mode: null };

  pill(active) {
    return 'padding:.6rem 1rem;border-radius:999px;text-align:center;cursor:pointer;font:600 .8125rem Inter,sans-serif;transition:background-color .2s,color .2s;' +
      (active ? 'background:#10b981;color:#04120d' : 'color:rgba(230,239,235,.66)');
  }

  componentDidMount() {
    const q = (location.hash || location.search || '').toLowerCase();
    if (q.indexOf('signup') > -1 || q.indexOf('create') > -1) this.setState({ mode: 'signup' });
  }

  renderVals() {
    const signUp = (this.state.mode ?? this.props.mode ?? 'signin') === 'signup';
    return {
      isSignUp: signUp,
      isSignIn: !signUp,
      showSignUp: () => this.setState({ mode: 'signup' }),
      showSignIn: () => this.setState({ mode: 'signin' }),
      signUpTab: 'flex:1;' + this.pill(signUp),
      signInTab: 'flex:1;' + this.pill(!signUp),
      formHeading: signUp ? 'Plant your flag.' : 'Welcome back.',
      formCopy: signUp
        ? 'Create the account, choose where you want to sell first, and your store is live before you finish reading this page.'
        : 'Pick up where you left off. You land in your default market; the rest are one click away.',
      submitLabel: signUp ? 'Create account' : 'Sign in',
      submitHref: signUp ? 'First Run.dc.html' : 'Admin Dashboard.dc.html',
      legalNote: signUp
        ? 'Free for 14 days. No card. Close the account and every store with it, whenever you like.'
        : 'Two-factor authentication applies where your organization requires it.',
      points: signUp
        ? [
            { text: 'One account, as many storefronts as your plan allows.' },
            { text: 'Regions, currencies and tax rules configured per store.' },
            { text: 'No card until the trial ends.' },
          ]
        : [
            { text: 'Single sign-on available on Scale plans.' },
            { text: 'Session history and device list in your profile.' },
            { text: 'Support answers in under four hours on weekdays.' },
          ],
    };
  }
}

</script>
</body>
</html>
