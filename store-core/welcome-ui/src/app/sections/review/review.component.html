<section id="review" class="review-area ptb_100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <!-- Section Heading -->
        <div class="section-heading text-center">
                            <span class="d-inline-block rounded-pill shadow-sm fw-5 px-4 py-2 mb-3">
                                <i class="far fa-lightbulb text-primary mr-1"></i>
                                <span class="text-primary">Customer's</span>
                                Reviews
                            </span>
          <h2 class="text-capitalize">{{ title }}</h2>
          <p class="d-none d-sm-block mt-4">{{ desc }}</p>
        </div>
      </div>
    </div>
    <div class="row">
      <div *ngFor="let r of reviews" class="col-12 col-md-6 col-lg-4 res-margin">
        <!-- Single Review -->
        <div class="single-review card">
          <!-- Card Top -->
          <div class="card-top p-4">
            <div class="review-icon">
              <i *ngFor="let item of [].constructor(r.stars); let i = index" class="fas fa-star text-warning"></i>
            </div>
            <h4 class="text-primary mt-4 mb-3">{{ r.subject }}</h4>
            <!-- Review Text -->
            <div class="review-text">
              <p>{{ r.review }}</p>
            </div>
            <!-- Quotation Icon -->
            <div class="quot-icon">
              <img class="avatar-md" src="img/icon/quote.png" alt="">
            </div>
          </div>
          <!-- Reviewer -->
          <div class="reviewer media bg-gray p-4">
            <!-- Reviewer Thumb -->
            <div class="reviewer-thumb">
              <img class="avatar-lg radius-100" [src]="r.creator.img" alt="">
            </div>
            <!-- Reviewer Media -->
            <div class="reviewer-meta media-body align-self-center ml-4">
              <h5 class="reviewer-name color-primary mb-2">{{ r.creator.name }}</h5>
              <h6 class="text-secondary fw-6">{{ r.creator.position }}, {{ r.creator.company }}</h6>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
