<section id="features" class="section features-area style-two overflow-hidden ptb_100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <!-- Section Heading -->
        <div class="section-heading text-center">
                            <span class="d-inline-block rounded-pill shadow-sm fw-5 px-4 py-2 mb-3">
                                <i class="far fa-lightbulb text-primary mr-1"></i>
                                <span class="text-primary">Premium</span>
                                Features
                            </span>
          <h2>{{title}}</h2>
          <p class="d-none d-sm-block mt-4">{{desc}}</p>
        </div>
      </div>
    </div>
    <div class="row">
      <div *ngFor="let f of features" class="col-12 col-md-6 col-lg-4 res-margin">
        <!-- Image Box -->
        <div class="image-box text-center icon-1 p-5 wow" [ngClass]="f.fade" data-wow-delay="0.4s">
          <!-- Featured Image -->
          <div class="featured-img mb-3">
            <img class="avatar-sm" [src]="f.img" alt="">
          </div>
          <!-- Icon Text -->
          <div class="icon-text">
            <h3 class="mb-2">{{f.title}}</h3>
            <p>{{f.desc}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
