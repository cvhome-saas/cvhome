<section id="pricing" class="section price-plan-area bg-gray overflow-hidden ptb_100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <!-- Section Heading -->
        <div class="section-heading text-center">
          <h2>{{title}}</h2>
          <p class="d-none d-sm-block mt-4">{{desc}}</p>
        </div>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-12 col-sm-12 col-lg-12">
        <div class="row price-plan-wrapper">
          <div *ngFor="let p of prices" class="col-12 col-md-4">
            <!-- Single Price Plan -->
            <div class="single-price-plan text-center p-5 wow " [ngClass]="p.fade" data-aos-duration="2s"
                 data-wow-delay="0.4s">
              <!-- Plan Thumb -->
              <div class="plan-thumb">
                <img class="avatar-lg" [src]="p.icon" alt="">
              </div>
              <!-- Plan Title -->
              <div class="plan-title my-2 my-sm-3">
                <h4 class="text-uppercase">{{ p.name }}</h4>
              </div>
              <!-- Plan Price -->
              <div class="plan-price pb-2 pb-sm-3">
                <h2 class="fw-7"><small class="fw-6">$</small>{{ p.cost }}</h2>
              </div>
              <!-- Plan Description -->
              <div class="plan-description">
                <ul class="plan-features">
                  <li *ngFor="let pf of p.pricingFeatures" class="border-top py-3">{{ pf.desc }}</li>
                </ul>
              </div>
              <!-- Plan Button -->
              <div class="plan-button">
                <a [routerLink]="['/signup']" class="btn mt-4">Sign Up</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row justify-content-center pt-5">
      <p class="text-body pt-4 fw-5">Not sure what to choose? <a href="#contact">Contact Us</a></p>
    </div>
  </div>
</section>
