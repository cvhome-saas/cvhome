<section id="contact" class="contact-area bg-gray ptb_100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <!-- Section Heading -->
        <div class="section-heading text-center">
          <h2 class="text-capitalize">{{title}}</h2>
          <p class="d-none d-sm-block mt-4">{{d1}}</p>
        </div>
      </div>
    </div>
    <div class="row justify-content-between">
      <div class="col-12 col-md-5">
        <!-- Contact Us -->
        <div class="contact-us">
          <p class="mb-3">{{d2}}</p>
          <ul>
            <li class="py-2">
              <a class="media" href="#">
                <div class="social-icon mr-3">
                  <i class="fas fa-home"></i>
                </div>
                <span class="media-body align-self-center">{{address}}</span>
              </a>
            </li>
            <li class="py-2">
              <a class="media" href="#">
                <div class="social-icon mr-3">
                  <i class="fas fa-phone-alt"></i>
                </div>
                <span class="media-body align-self-center">{{phone}}</span>
              </a>
            </li>
            <li class="py-2">
              <a class="media" href="#">
                <div class="social-icon mr-3">
                  <i class="fas fa-envelope"></i>
                </div>
                <span class="media-body align-self-center">{{email}}</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="col-12 col-md-6 pt-4 pt-md-0">
        <!-- Contact Box -->
        <div class="contact-box text-center">
          <!-- Contact Form -->
          <form id="contact-form" [formGroup]="contactForm">
            <div class="row">
              <div class="col-12">
                <div class="form-group">
                  <input type="text" formControlName="name" class="form-control" name="name" placeholder="Name" required="required">
                </div>
                <div class="form-group">
                  <input type="email" formControlName="email" class="form-control" name="email" placeholder="Email" required="required">
                </div>
                <div class="form-group">
                  <input type="text" formControlName="subject" class="form-control" name="subject" placeholder="Subject" required="required">
                </div>
              </div>
              <div class="col-12">
                <div class="form-group">
                  <textarea formControlName="message" class="form-control" name="message" placeholder="Message" required="required"></textarea>
                </div>
              </div>
              <div class="col-12">
                <button type="button" (click)="contact()" class="btn btn-lg btn-block mt-3"><span class="text-white pr-3"><i class="fas fa-paper-plane"></i></span>Send Message</button>
              </div>
            </div>
          </form>
          <p class="form-message"></p>
        </div>
      </div>
    </div>
  </div>
</section>
