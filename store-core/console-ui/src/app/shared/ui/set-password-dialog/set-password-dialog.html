<!-- The close/cancel events are the platform's dismissal signals: Escape and the backdrop. -->
<dialog #dialog class="set-password" (close)="dismissed.emit()" (cancel)="dismissed.emit()">
  <form method="dialog" class="set-password-body" (submit)="onSubmit($event)">
    <h2 class="set-password-title">{{ title() }}</h2>
    <p class="set-password-message">{{ message() }}</p>

    <app-form-field [label]="passwordLabel()" [hint]="hint()" required wide>
      <app-text-field
        [(value)]="password"
        type="password"
        autocomplete="new-password"
        [invalid]="touched() && weak()"
        [disabled]="busy()"
        [ariaLabel]="passwordLabel()"
      />
    </app-form-field>

    <app-form-field [label]="repeatLabel()" required wide>
      <app-text-field
        [(value)]="repeat"
        type="password"
        autocomplete="new-password"
        [invalid]="touched() && !weak() && mismatched()"
        [disabled]="busy()"
        [ariaLabel]="repeatLabel()"
      />
    </app-form-field>

    @if (error(); as message) {
      <p class="set-password-error" role="alert">{{ message }}</p>
    }

    <!-- Nothing on the platform sends email, so the operator is the delivery mechanism. -->
    <p class="set-password-hint">{{ handoverHint() }}</p>

    <div class="set-password-actions">
      <button class="secondary-action" type="button" [disabled]="busy()" (click)="close()">
        {{ cancelLabel() }}
      </button>
      <button class="primary-action" type="submit" [disabled]="busy()">
        {{ busy() ? busyLabel() : confirmLabel() }}
      </button>
    </div>
  </form>
</dialog>
