<main class="auth-shell" *transloco="let t">
  <app-auth-story [story]="facade.signUpStory()" />

  <section class="auth-entry" [attr.aria-label]="t('auth.accountAccess')">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="auth-tabs" role="group" [attr.aria-label]="t('auth.accountAction')">
        <a routerLink="/sign-up" class="active" aria-current="page">{{ t('auth.createAccount') }}</a>
        <a routerLink="/sign-in">{{ t('auth.signIn') }}</a>
      </div>

      <div class="auth-fields" formGroupName="user">
        <label>{{ t('auth.signUp.firstName') }}<input formControlName="firstName" type="text" autocomplete="given-name" required><app-field-error [control]="user.controls.firstName" [fallback]="t('auth.signUp.firstNameFallback')" /></label>
        <label>{{ t('auth.signUp.lastName') }}<input formControlName="lastName" type="text" autocomplete="family-name" required><app-field-error [control]="user.controls.lastName" [fallback]="t('auth.signUp.lastNameFallback')" /></label>
        <label>{{ t('auth.signUp.email') }}<input formControlName="emailAddress" type="email" autocomplete="email" required><app-field-error [control]="user.controls.emailAddress" [fallback]="t('auth.signUp.emailFallback')" /></label>
        <label>{{ t('auth.signUp.password') }}
          <span class="password-field">
            <input formControlName="password" [type]="facade.passwordVisible() ? 'text' : 'password'" autocomplete="new-password" required>
            <button type="button" (click)="facade.passwordVisible.set(!facade.passwordVisible())" [attr.aria-label]="facade.passwordVisible() ? t('auth.signUp.hidePassword') : t('auth.signUp.showPassword')">
              <span aria-hidden="true">{{ facade.passwordVisible() ? t('auth.signUp.hide') : t('auth.signUp.show') }}</span>
            </button>
          </span>
          <app-field-error [control]="user.controls.password" [fallback]="t('auth.signUp.passwordFallback')" />
        </label>
        <label>{{ t('auth.signUp.repeatPassword') }}
          <input formControlName="repeatPassword" [type]="facade.passwordVisible() ? 'text' : 'password'" autocomplete="new-password" required>
          <app-field-error [control]="user.controls.repeatPassword" [fallback]="t('auth.signUp.repeatPasswordFallback')" />
        </label>
        @if (user.errors?.['passwordMismatch'] && user.controls.repeatPassword.touched) {
          <small class="field-error" aria-live="polite">{{ t('auth.signUp.passwordMismatch') }}</small>
        }

        <button class="auth-submit" type="submit" [disabled]="facade.submitting() || facade.submitted()">
          {{ facade.submitting() ? t('auth.signUp.creating') : t('auth.createAccount') }}
          @if (!facade.submitting()) { <span aria-hidden="true">→</span> }
        </button>

        <p class="legal">{{ t('auth.signUp.legalNote') }}</p>
      </div>
    </form>
  </section>
</main>
