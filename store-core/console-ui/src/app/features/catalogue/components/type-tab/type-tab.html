<ng-container *transloco="let t">
  @if (unavailable()) {
    <app-notice-bar icon="alertCircle" tone="red" [message]="t('catalogue.types.unavailable')" />
  }

  <div class="split">
    <app-panel
      class="list-panel"
      [title]="t('catalogue.types.title')"
      [subtitle]="t('catalogue.types.subtitle', {count: types().length})"
    >
      <ul class="type-list">
        @for (type of types(); track type.id) {
          <li>
            <button
              class="type-row"
              type="button"
              [class.current]="type.id === facade.selectedTypeId()"
              [attr.aria-pressed]="type.id === facade.selectedTypeId()"
              (click)="facade.select('types', type.id)"
            >
              <span class="type-icon" aria-hidden="true"><app-icon name="tag" [size]="15" /></span>
              <span class="type-copy">
                <strong dir="auto">{{ type.name }}</strong>
                <small dir="ltr">{{ type.code }}</small>
                @if (type.description) {
                  <span class="type-blurb" dir="auto">{{ type.description }}</span>
                }
              </span>
            </button>
          </li>
        } @empty {
          <li class="list-empty">{{ t('catalogue.types.none') }}</li>
        }
      </ul>

      <div class="list-foot">
        <button class="secondary-action" type="button" (click)="facade.startCreate()">
          <app-icon name="plus" />
          {{ t('catalogue.add.types') }}
        </button>
      </div>
    </app-panel>

    <app-panel
      class="editor-panel"
      [title]="creating() ? t('catalogue.types.newTitle') : (selected()?.name ?? t('catalogue.types.noneTitle'))"
      [subtitle]="creating() ? t('catalogue.types.newSubtitle') : (selected()?.code ?? null)"
    >
      @if (!creating() && !selected()) {
        <app-empty-state icon="tag" [message]="t('catalogue.types.empty')">
          <button class="secondary-action" type="button" (click)="facade.startCreate()">
            {{ t('catalogue.add.types') }}
          </button>
        </app-empty-state>
      } @else {
        <form class="editor-body" [formGroup]="form" (ngSubmit)="facade.saveType()">
          <div class="editor-head">
            <app-locale-switcher
              [languages]="facade.languages()"
              [active]="facade.activeLanguage()"
              [filled]="facade.translatedLanguages()"
              [label]="t('catalogue.copy.languageLabel')"
              (activeChange)="facade.setLanguage($event)"
            />

            @if (!creating() && selected(); as type) {
              <button
                class="danger-action"
                type="button"
                [disabled]="facade.busy()"
                (click)="facade.askDelete('types', type.id, type.name)"
              >
                <app-icon name="trash" />
                {{ t('catalogue.types.delete') }}
              </button>
            }
          </div>

          <!--
            Said once, at the top of the editor, rather than as five disabled controls further
            down. A type genuinely is this small on this platform, and the operator is better
            served by knowing that than by a panel of fields that never do anything.
          -->
          <app-notice-bar icon="info" tone="blue" [message]="t('catalogue.types.noAttributes')" />

          <app-copy-fields
            [form]="form.controls.copy"
            scope="type"
            [languageName]="facade.activeLanguageName()"
            [showSlug]="false"
            (nameChanged)="onNameInput($event)"
          />

          <hr class="divider" />

          <div class="field-grid">
            <!--
              One uniqueness affordance for the whole console: checking, taken, free. The spinner is not
              decoration — the check is debounced, so without it the field looks like it has already
              passed. It used to be three hand-placed marks here, a fourth arrangement in create-store,
              and a lone tick in the social links.
            -->
            <app-form-field
              wide
              [label]="t('catalogue.code')"
              [control]="form.controls.code"
              required
              controlId="type-code"
              [hint]="creating() ? t('catalogue.codeHintNew') : t('catalogue.codeHintExisting')"
              [fallback]="form.controls.code.hasError('codeTaken') ? t('catalogue.codeTaken') : ''"
            >
              <app-text-field
                id="type-code"
                formControlName="code"
                latin
                [check]="codeCheck()"
                [checkLabel]="t('catalogue.codeChecking')"
                [invalid]="form.controls.code.hasError('codeTaken')"
              />
            </app-form-field>

            <div class="field field-wide">
              <app-toggle
                [checked]="form.controls.visible.value"
                (checkedChange)="form.controls.visible.setValue($event)"
                [label]="t('catalogue.types.visible')"
                [description]="t('catalogue.types.visibleHint')"
              />
            </div>

            <div class="field field-wide">
              <app-toggle
                [checked]="form.controls.allowAddToCart.value"
                (checkedChange)="form.controls.allowAddToCart.setValue($event)"
                [label]="t('catalogue.types.allowAddToCart')"
                [description]="t('catalogue.types.allowAddToCartHint')"
              />
            </div>
          </div>

          <div class="editor-actions">
            <button class="secondary-action" type="button" (click)="facade.cancelEdit()">
              {{ t('shared.actions.cancel') }}
            </button>
            <button
              class="primary-action"
              type="submit"
              [disabled]="facade.busy()"
              [attr.aria-busy]="facade.busy()"
            >
              {{ creating() ? t('catalogue.types.create') : t('catalogue.types.save') }}
            </button>
          </div>
        </form>
      }
    </app-panel>
  </div>
</ng-container>
