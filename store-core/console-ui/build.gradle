plugins {
  alias(libs.plugins.ui.conventions)
  alias(libs.plugins.node)
}

bootBuildImage {
  imageGroup = "store-core"
}

/*
 * `npm run lint` is the only thing that enforces the Token Rule and the logical-property rule that
 * `.stylelintrc.json` describes, and until this it ran nowhere — not in `check`, not in CI, not in
 * a hook. That is why the spacing debt in `Todos.md` regrew after being consolidated once. Wired
 * here rather than in `com.asrevo.ui-conventions` because that plugin is shared with landing-ui,
 * which has not been surveyed and would fail on five lint scripts it has never run.
 */
tasks.named('check') {
  dependsOn('npm_run_lint')
}

/*
 * npm resolves `"@cvhome-saas/ui-kit": "file:…/dist/ui-kit"` by reading that directory's
 * package.json, so the library has to be built before this module installs. Without this a clean
 * checkout fails at `npmInstall` with an ENOENT naming a path no one recognises.
 */
tasks.named('npmInstall') {
  dependsOn ':store-commons:ui-kit:build'
}
