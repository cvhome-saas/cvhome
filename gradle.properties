version=1.0.16

# The coverage aggregation is what needs this. Every domain report reads the union of all modules' .exec files
# (see com.asrevo.jacoco-aggregate-conventions: JaCoCo's agent has no includes filter, so a module's exec records
# every class its JVM loaded and scoping the data per domain threw that away). Fifteen domains times three kinds
# is forty-five report tasks over ~22 MB of probe data, and the daemon's 512 MiB default GC-thrashes partway
# through `./gradlew check`, taking the build down with a heap dump beside it.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build
