// Root build: intentionally minimal. Everything about a module lives in its own build.gradle and the
// convention plugins in build-logic/. This file only aggregates coverage across modules.
plugins {
    alias(libs.plugins.jacoco.aggregate.conventions)
}

// The aggregation resolves every module's runtime classpath, so the root needs the same repositories the
// convention plugins give the modules.
repositories {
    mavenLocal()
    maven { url = 'https://repo.spring.io/milestone' }
    mavenCentral()
    gradlePluginPortal()
}

// Per-domain LINE-coverage floors, one per test kind (see com.asrevo.jacoco-aggregate-conventions). Ratchet: run
// `./gradlew printDomainCoverage`, bump a domain's floors to what it now achieves (rounded down to 0.01); never lower.
//
// The contract, since the coverage push: unit >= 0.95 and merged >= 0.95 for every in-scope domain, and integration
// ratcheted to what each domain actually achieves rather than held to a number of its own. Unit and integration miss
// disjoint things by design — unit misses the thin `*Api` controllers, the exception classes and the repositories that
// only exist once a context is booted; integration misses the external-provider adapters, the error factories only a
// consumer service invokes, and the scheduled jobs. A hard 0.95 on both would mean covering the same class twice in
// two styles, so integration gets a behavioural contract (every endpoint tested, every store-scoped one with a
// tenant-isolation and a 403 case, every outbox handler idempotent) plus this floor, which only moves up.
//
// A floor above the general bar is a domain that has earned it; it stays where it is rather than being relaxed to 0.95.
ext.domainCoverageMinimum = [
        // Merged is at 1.00 and capped here at 0.99 on purpose: a floor of exactly 1.00 fails the build on the
        // first line of new code, before its test can land in the same commit.
        inventory     : [unit: 0.95, integration: 0.96, merged: 0.99],
        'pod-registry': [unit: 0.95, integration: 0.77, merged: 0.99],
        merchant      : [unit: 0.95, integration: 0.91, merged: 0.99],
        gateway       : [unit: 0.97, integration: 0.72, merged: 0.97],
        payment       : [unit: 0.98, integration: 0.74, merged: 0.99],
        content       : [unit: 0.95, integration: 0.87, merged: 0.99],
        // Tenancy's integration figure is not deterministic: its outbox handlers run on a poller, so whether
        // those lines execute inside a test's window varies. Two clean runs measured 0.7883/0.9830 and
        // 0.7993/0.9793. The floors sit at the bottom of the observed range rather than the top — ratcheting a
        // nondeterministic domain to its best run buys nothing and makes the gate fail at random.
        tenancy       : [unit: 0.95, integration: 0.78, merged: 0.97],
        catalog       : [unit: 0.95, integration: 0.94, merged: 0.99],
        billing       : [unit: 0.95, integration: 0.75, merged: 0.97],
        // sso = the authorization server shared by store-core/uaa and store-pod/cua. Its own domain since the
        // extraction: ~12.7k lines in `shared`'s denominator made both numbers meaningless.
        sso           : [unit: 0.95, integration: 0.83, merged: 0.97],
        // shared = the store-commons libraries. They own no integrationTest source set of their own; since the
        // coverage fix they are credited from the services that boot them, so the integration column is real — and
        // low for the honest reason that a library is exercised by whichever service happens to use it.
        shared        : [unit: 0.95, integration: 0.69, merged: 0.96],
        // Thin shells since the SSO extraction: everything they own beyond their two deployment seams lives in sso.
        // The integration floors are low because most of what a request touches is counted against `sso`, not here.
        uaa           : [unit: 0.95, integration: 0.96, merged: 0.99],
        cua           : [unit: 0.95, integration: 0.67, merged: 0.98],
        // :store-pod:commons:* — the pod-shared DTO libraries (store-commons, customer-commons, reference-commons).
        // Since the checkout rewrite they hold no service code of their own; reported, not gated.
        'pod-commons' : [unit: 0.0, integration: 0.0, merged: 0.0],
        // Rewritten 2026-09; the floors are what the rewrite's suites measured, rounded down.
        checkout      : [unit: 0.97, integration: 0.86, merged: 0.99],
]
